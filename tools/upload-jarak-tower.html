async function uploadJarakData() {
  const API_URL = 'https://script.google.com/macros/s/AKfycbyYY9G3RxiwBoWvAtVZsNBn-bC4KeJuG2NEVksGtvRhMFuCYMOa25hlp7znq__0pw4r1A/exec';
  const password = prompt('Password GI Situbondo:');
  
  if (!password) return alert('Password diperlukan');
  
  console.log('Loading existing towers...');
  
  // Load existing towers
  const loadRes = await fetch(`${API_URL}?action=load&sheet=tower_master&password=${password}`);
  const loadData = await loadRes.json();
  
  if (!loadData.ok) {
    return alert('Error load: ' + loadData.error);
  }
  
  const towers = loadData.data || [];
  console.log(`Loaded ${towers.length} towers`);
  
  // Update dengan jarak data
  let updateCount = 0;
  const penghantar_mapping = {
    'BONDOWOSO-SITUBONDO': 'BONDOWOSO-SITUBONDO',
    'PAITON-SITUBONDO': 'PAITON-SITUBONDO',
    'SITUBONDO-BANYUWANGI': 'STBDO-BWI'
  };
  
  const updatedTowers = towers.map(tower => {
    const penghantar = tower.penghantar || '';
    const nomor = parseInt(tower.nomor);
    
    // Find jarak data
    for (const [excelName, dbName] of Object.entries(penghantar_mapping)) {
      if (penghantar.includes(dbName) || dbName.includes(penghantar)) {
        const penghantar_data = jarakTowerData[excelName];
        if (penghantar_data) {
          const match = penghantar_data.towers.find(t => t.nomor === nomor);
          if (match) {
            tower.jarak_dari_gi = match.jarak_dari_gi_m;
            tower.span = match.span_m;
            updateCount++;
            console.log(`✓ Tower ${penghantar}-${nomor}: ${match.jarak_dari_gi_m}m`);
            break;
          }
        }
      }
    }
    
    return tower;
  });
  
  if (updateCount === 0) {
    return alert('Tidak ada tower yang match!');
  }
  
  console.log(`Will update ${updateCount} towers`);
  
  if (!confirm(`Update ${updateCount} towers dengan data jarak?`)) {
    return;
  }
  
  // Save
  const saveRes = await fetch(API_URL, {
    method: 'POST',
    body: JSON.stringify({
      action: 'save',
      sheet: 'tower_master',
      password: password,
      data: JSON.stringify(updatedTowers)
    })
  });
  
  const saveData = await saveRes.json();
  
  if (saveData.success) {
    alert(`✅ ${updateCount} towers berhasil di-update!`);
    console.log('Success:', saveData);
  } else {
    alert('Error: ' + saveData.message);
  }
}
