<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PLN GI Suite — Masuk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; font-family: 'Inter', sans-serif; overflow: hidden; }

.scene {
  position: relative; width: 100%; height: 100vh;
  background:
    var(--photo, none) center/cover no-repeat,
    linear-gradient(180deg, #1a2740 0%, #3a3050 35%, #a3542f 68%, #d98d4a 85%, #f0b26b 100%);
  overflow: hidden;
}
.scene svg.silhouette { position: absolute; bottom: 0; left: 0; width: 100%; height: 62%; }
.overlay { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10,14,20,0.2) 0%, rgba(10,14,20,0.55) 70%, rgba(10,14,20,0.88) 100%); }

.hotspot { position: absolute; width: 24px; height: 24px; border-radius: 50%; background: rgba(255,255,255,0.15); border: 2px solid rgba(255,255,255,0.75); cursor: pointer; }
.hotspot::after { content: ''; position: absolute; inset: 6px; border-radius: 50%; background: #fff; animation: pulse 2.2s infinite; }
@keyframes pulse { 0%,100% { opacity: .45; transform: scale(.85); } 50% { opacity: 1; transform: scale(1); } }
@media (prefers-reduced-motion: reduce) { .hotspot::after { animation: none; } }
.tooltip {
  position: absolute; bottom: 34px; left: 50%; transform: translateX(-50%) translateY(6px);
  background: rgba(15,20,28,0.96); color: #fff; padding: 10px 13px; border-radius: 8px;
  white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity .16s ease, transform .16s ease;
  border: 1px solid rgba(255,255,255,0.12);
}
.hotspot:hover .tooltip, .hotspot:focus-visible .tooltip { opacity: 1; transform: translateX(-50%) translateY(0); }
.tooltip strong { display: block; font-size: 13px; margin-bottom: 3px; font-family: 'Manrope', sans-serif; font-weight: 600; }
.tooltip span { color: #9fb0bd; font-size: 11.5px; }

.brand-mark { position: absolute; top: 34px; left: 44px; color: #fff; font-family: 'Manrope', sans-serif; font-weight: 800; font-size: 19px; letter-spacing: -0.01em; }
.brand-mark span { display: block; font-family: 'Inter', sans-serif; font-weight: 400; font-size: 11px; letter-spacing: 0.09em; text-transform: uppercase; color: rgba(255,255,255,0.6); margin-top: 3px; }

.login-card {
  position: absolute; bottom: 64px; left: 44px; width: 340px;
  background: rgba(18,22,29,0.78); backdrop-filter: blur(14px);
  border: 1px solid rgba(255,255,255,0.12); border-radius: 14px; padding: 26px; color: #fff;
}
.login-card h1 { font-family: 'Manrope', sans-serif; font-size: 21px; font-weight: 800; margin: 0 0 4px; }
.login-card p.sub { font-size: 12.5px; color: rgba(255,255,255,0.55); margin: 0 0 20px; }
.login-card label { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.07em; color: rgba(255,255,255,0.5); display: block; margin-bottom: 7px; font-weight: 600; }
.login-card input {
  width: 100%; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.18);
  border-radius: 8px; padding: 11px 13px; color: #fff; font-size: 14px; font-family: 'Inter', sans-serif;
}
.login-card input:focus { outline: 2px solid rgba(255,255,255,0.4); outline-offset: 1px; }
.login-card input::placeholder { color: rgba(255,255,255,0.3); }
.login-card button {
  width: 100%; margin-top: 16px; background: #fff; color: #17212f; border: none; border-radius: 8px;
  padding: 12px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: 'Inter', sans-serif;
}
.login-card button:disabled { opacity: .6; cursor: default; }
.login-card .hint { margin-top: 14px; font-size: 11px; color: rgba(255,255,255,0.4); text-align: center; }
.err { margin-top: 12px; font-size: 12px; color: #ffb4ab; background: rgba(186,26,26,0.18); border: 1px solid rgba(255,180,171,0.3); border-radius: 8px; padding: 9px 11px; display: none; }

@media (max-width: 720px) {
  .login-card { left: 16px; right: 16px; width: auto; bottom: 24px; }
  .brand-mark { left: 20px; top: 24px; }
  .hotspot { display: none; }
}
</style>
</head>
<body>
<div class="scene" id="scene">
  <!-- Siluet gardu induk & menara transmisi.
       Untuk mengganti dengan foto asli GI Situbondo: set CSS var --photo pada .scene,
       mis. style="--photo: url('assets/gi-situbondo.jpg')", lalu hapus <svg class="silhouette">. -->
  <svg class="silhouette" viewBox="0 0 1200 500" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <g stroke="#0a1018" stroke-width="3" fill="none" opacity="0.92">
      <path d="M180 500 L220 260 L260 500 M180 500 L260 500 M195 420 L245 420 M200 360 L240 360 M205 310 L235 310"/>
      <line x1="130" y1="270" x2="310" y2="270"/>
      <line x1="150" y1="292" x2="290" y2="292"/>
    </g>
    <g stroke="#0a1018" stroke-width="3" fill="none" opacity="0.88">
      <path d="M700 500 L745 240 L790 500 M700 500 L790 500 M715 430 L775 430 M722 365 L768 365 M728 305 L762 305"/>
      <line x1="640" y1="250" x2="850" y2="250"/>
    </g>
    <g stroke="#0a1018" stroke-width="3" fill="none" opacity="0.82">
      <path d="M980 500 L1015 300 L1050 500 M980 500 L1050 500 M990 420 L1040 420 M995 360 L1035 360"/>
    </g>
    <rect x="380" y="360" width="92" height="140" fill="#0a1018" opacity="0.92"/>
    <rect x="396" y="330" width="14" height="30" fill="#0a1018" opacity="0.92"/>
    <rect x="442" y="330" width="14" height="30" fill="#0a1018" opacity="0.92"/>
    <circle cx="520" cy="410" r="26" fill="none" stroke="#0a1018" stroke-width="3" opacity="0.88"/>
    <line x1="0" y1="500" x2="1200" y2="500" stroke="#0a1018" stroke-width="60" opacity="0.55"/>
  </svg>
  <div class="overlay"></div>

  <div class="brand-mark">PLN GI Suite<span>GI Situbondo</span></div>

  <div id="hotspot-layer"></div>

  <div class="login-card">
    <h1>Masuk</h1>
    <p class="sub">Monitoring &amp; dokumen GI Situbondo</p>
    <form id="login-form">
      <label for="pw">Kode akses</label>
      <input id="pw" type="password" placeholder="••••••••" autocomplete="current-password" autofocus>
      <button type="submit" id="btn-login">Masuk</button>
    </form>
    <div class="err" id="err"></div>
    <div class="hint">Akses terbatas tim internal</div>
  </div>
</div>

<script src="shared/api.js"></script>
<script>
  // Titik interaktif di background. Posisi dalam persen (kiri, atas) supaya
  // ikut menyesuaikan saat ukuran layar berubah.
  const HOTSPOTS = [
    { left: 35, top: 63, title: 'Trafo daya', desc: 'Peralatan utama gardu induk' },
    { left: 43, top: 78, title: 'Bay penghantar', desc: 'Titik sambung ke jalur transmisi' },
    { left: 62, top: 45, title: 'Menara transmisi', desc: '417 tower termonitor' },
    { left: 84, top: 57, title: 'Jalur SUTT 150 kV', desc: '3 penghantar aktif' }
  ];

  const layer = document.getElementById('hotspot-layer');
  layer.innerHTML = HOTSPOTS.map((h) => `
    <div class="hotspot" style="left:${h.left}%; top:${h.top}%;" tabindex="0" role="button" aria-label="${h.title}">
      <div class="tooltip"><strong>${h.title}</strong><span>${h.desc}</span></div>
    </div>`).join('');

  // Kalau sudah punya kode akses di sesi ini, langsung ke dashboard.
  if (getPassword()) window.location.replace('dashboard.html');

  const form = document.getElementById('login-form');
  const btn = document.getElementById('btn-login');
  const errBox = document.getElementById('err');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const pw = document.getElementById('pw').value;
    errBox.style.display = 'none';
    btn.disabled = true; btn.textContent = 'Memeriksa…';
    try {
      const res = await verifyPassword(pw);
      if (res.ok) {
        setPassword(pw);
        window.location.href = 'dashboard.html';
      } else {
        errBox.textContent = res.error;
        errBox.style.display = 'block';
        btn.disabled = false; btn.textContent = 'Masuk';
      }
    } catch (err) {
      errBox.textContent = 'Tidak bisa menghubungi server: ' + err.message;
      errBox.style.display = 'block';
      btn.disabled = false; btn.textContent = 'Masuk';
    }
  });
</script>
</body>
</html>
