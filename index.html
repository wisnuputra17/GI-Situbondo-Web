<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PLN GI Suite — Masuk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* === Design tokens from shared/tailwind-config.js === */
:root {
  --sc-lowest:#ffffff; --sc-low:#eff4ff; --sc:#e5eeff; --sc-high:#dce9ff; --sc-highest:#d3e4fe;
  --on-surface:#0b1c30; --on-surface-variant:#444748;
  --outline:#747878; --outline-variant:#c4c7c7;
  --primary:#0b1c30; --on-primary:#ffffff;
  --secondary:#006d35; --on-secondary:#ffffff;
  --tertiary:#8a5300; --tertiary-container:#ffe0b3; --on-tertiary-container:#6e3900;
  --error:#ba1a1a; --on-error:#ffffff; --error-container:#ffdad6; --on-error-container:#93000a;
  --shadow-color: 0 0% 40%;
}
html.dark {
  --sc-lowest:#141a22; --sc-low:#1a212b; --sc:#1f2731; --sc-high:#262f3a; --sc-highest:#2d3742;
  --on-surface:#e3e8ef; --on-surface-variant:#9aa5b1;
  --outline:#6b7684; --outline-variant:#364150;
  --primary:#7fb3ff; --on-primary:#0a1420;
  --secondary:#4ade80; --on-secondary:#052e16;
  --tertiary:#fbbf24; --tertiary-container:#453113; --on-tertiary-container:#fcd34d;
  --error:#f87171; --on-error:#450a0a; --error-container:#4c1d1d; --on-error-container:#fca5a5;
  --shadow-color: 0 0% 0%;
}
html { color-scheme: light; }
html.dark { color-scheme: dark; }

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; font-family: 'Inter', sans-serif; overflow: hidden; }

/* === Scenic background === */
.scene {
  position: relative; width: 100%; height: 100vh;
  background: var(--photo, none) center/cover no-repeat,
    linear-gradient(180deg, #1a2740 0%, #3a3050 35%, #a3542f 68%, #d98d4a 85%, #f0b26b 100%);
  overflow: hidden;
}
.scene svg.silhouette { position: absolute; bottom: 0; left: 0; width: 100%; height: 62%; z-index: 2; }

/* Atmospheric depth layers */
.scene::before {
  content: ''; position: absolute; inset: 0; z-index: 3;
  background:
    radial-gradient(ellipse at 50% 30%, rgba(255,255,255,0.08) 0%, transparent 60%),
    radial-gradient(ellipse at 80% 80%, rgba(18,22,29,0.3) 0%, transparent 50%);
  pointer-events: none;
}
.scene::after {
  content: ''; position: absolute; inset: 0; z-index: 3;
  background:
    linear-gradient(180deg, rgba(10,14,20,0.15) 0%, rgba(10,14,20,0.35) 40%, rgba(10,14,20,0.75) 75%, rgba(10,14,20,0.92) 100%);
  pointer-events: none;
}
.overlay { position: absolute; inset: 0; z-index: 3; background: none; }

/* === Hotspots === */
.hotspot {
  position: absolute; width: 22px; height: 22px; border-radius: 50%;
  background: rgba(255,255,255,0.08); border: 1.5px solid rgba(255,255,255,0.5);
  cursor: pointer; z-index: 10; transition: background 0.2s, border-color 0.2s;
}
.hotspot:hover { background: rgba(255,255,255,0.2); border-color: rgba(255,255,255,0.9); }
.hotspot::after {
  content: ''; position: absolute; inset: 5px; border-radius: 50%;
  background: #fff; animation: pulse 2.4s ease-in-out infinite;
}
@keyframes pulse { 0%,100% { opacity:.3; transform:scale(.7); } 50% { opacity:1; transform:scale(1); } }
@media (prefers-reduced-motion: reduce) { .hotspot::after { animation: none; } }
.tooltip {
  position: absolute; bottom: 32px; left: 50%; transform: translateX(-50%) translateY(6px);
  background: rgba(15,20,28,0.95); color: #fff; padding: 10px 14px; border-radius: 8px;
  white-space: nowrap; opacity: 0; pointer-events: none;
  transition: opacity .2s ease, transform .2s ease; border: 1px solid rgba(255,255,255,0.1);
  z-index: 20;
}
.hotspot:hover .tooltip, .hotspot:focus-visible .tooltip { opacity: 1; transform: translateX(-50%) translateY(0); }
.tooltip strong { display: block; font-size: 12px; margin-bottom: 2px; font-family: 'Manrope', sans-serif; font-weight: 600; }
.tooltip span { color: #9fb0bd; font-size: 11px; }

/* === Brand mark === */
.brand-mark {
  position: absolute; top: 36px; left: 48px; z-index: 20; color: #fff;
  display: flex; align-items: center; gap: 10px;
  opacity: 0; transform: translateY(-8px);
  animation: slideDown .6s ease .1s forwards;
}
@keyframes slideDown { to { opacity: 1; transform: translateY(0); } }
.brand-mark .logo-icon {
  width: 28px; height: 28px; border-radius: 6px; background: rgba(255,255,255,0.12);
  display: flex; align-items: center; justify-content: center;
  border: 1px solid rgba(255,255,255,0.15);
  flex-shrink: 0;
}
.brand-mark .logo-icon svg { width: 16px; height: 16px; }
.brand-mark .label { display: flex; flex-direction: column; gap: 2px; }
.brand-mark .label-main { font-family: 'Manrope', sans-serif; font-weight: 800; font-size: 19px; letter-spacing: -0.01em; line-height: 1.2; }
.brand-mark .label-sub { font-family: 'Inter', sans-serif; font-weight: 400; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(255,255,255,0.5); }

/* === Login card === */
.login-card {
  position: absolute; bottom: 64px; left: 48px; width: 360px; z-index: 20;
  background: rgba(15,20,29,0.72); backdrop-filter: blur(20px) saturate(1.2); -webkit-backdrop-filter: blur(20px) saturate(1.2);
  border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 28px; color: #fff;
  opacity: 0; transform: translateY(16px);
  animation: slideUp .6s ease .25s forwards;
}
@keyframes slideUp { to { opacity: 1; transform: translateY(0); } }

.login-card .card-header { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
.login-card h1 { font-family: 'Manrope', sans-serif; font-size: 22px; font-weight: 800; margin: 0; letter-spacing: -0.02em; }
.login-card .badge {
  font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em;
  padding: 3px 8px; border-radius: 4px; background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.45);
  border: 1px solid rgba(255,255,255,0.06);
}
.login-card p.sub { font-size: 12.5px; color: rgba(255,255,255,0.45); margin: 0 0 22px; line-height: 1.5; }

/* Divider */
.login-card .divider { height: 1px; background: rgba(255,255,255,0.06); margin: 0 0 22px; }

/* === Form === */
.login-card .field { margin-bottom: 16px; }
.login-card label {
  font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em;
  color: rgba(255,255,255,0.35); display: block; margin-bottom: 6px;
}
.login-card .input-wrap { position: relative; }
.login-card .input-wrap .lock-icon {
  position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
  width: 16px; height: 16px; color: rgba(255,255,255,0.25);
  transition: color 0.2s;
}
.login-card input[type="password"], .login-card input[type="text"] {
  width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.12);
  border-radius: 10px; padding: 11px 13px 11px 38px; color: #fff; font-size: 14px; font-family: 'Inter', sans-serif;
  transition: border-color .2s, background .2s, box-shadow .2s; outline: none;
}
.login-card input::placeholder { color: rgba(255,255,255,0.2); }
.login-card input:hover { border-color: rgba(255,255,255,0.2); }
.login-card input:hover + .lock-icon, .login-card input:focus + .lock-icon { color: rgba(255,255,255,0.4); }
.login-card input:focus { border-color: rgba(255,255,255,0.35); background: rgba(255,255,255,0.07); box-shadow: 0 0 0 3px rgba(255,255,255,0.06); }
.login-card input:focus ~ .lock-icon { color: rgba(255,255,255,0.5); }
.login-card input::selection { background: rgba(255,255,255,0.2); }

/* === Button === */
.login-card button[type="submit"] {
  width: 100%; margin-top: 4px; background: #fff; color: #17212f; border: none; border-radius: 10px;
  padding: 12px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: 'Inter', sans-serif;
  transition: transform .12s, box-shadow .2s, opacity .2s; position: relative;
}
.login-card button[type="submit"]:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(0,0,0,0.3); }
.login-card button[type="submit"]:active:not(:disabled) { transform: translateY(0); box-shadow: none; }
.login-card button[type="submit"]:disabled { opacity: 0.65; cursor: default; transform: none; box-shadow: none; }
.spinner {
  display: none; width: 16px; height: 16px; border: 2px solid rgba(23,33,47,0.2);
  border-top-color: #17212f; border-radius: 50%; animation: spin .6s linear infinite;
  vertical-align: middle; margin-right: 6px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.login-card button[type="submit"].loading .btn-text { display: none; }
.login-card button[type="submit"].loading .spinner { display: inline-block; }

/* === Error === */
.login-card .err {
  margin-top: 12px; font-size: 12px; color: #ffb4ab; background: rgba(186,26,26,0.15);
  border: 1px solid rgba(255,180,171,0.25); border-radius: 8px; padding: 9px 12px;
  display: flex; align-items: center; gap: 8px;
  opacity: 0; transform: translateY(-4px); max-height: 0; overflow: hidden;
  transition: opacity .25s ease, transform .25s ease, max-height .3s ease, padding .3s ease, margin .3s ease;
  padding-top: 0; padding-bottom: 0; margin-top: 0;
}
.login-card .err.visible {
  opacity: 1; transform: translateY(0); max-height: 80px;
  padding: 9px 12px; margin-top: 12px;
}
.login-card .err svg { flex-shrink: 0; width: 14px; height: 14px; }

/* === Hint === */
.login-card .hint { margin-top: 14px; font-size: 10.5px; color: rgba(255,255,255,0.25); text-align: center; letter-spacing: 0.02em; }

/* === Responsive === */
@media (max-width: 720px) {
  .login-card { left: 16px; right: 16px; width: auto; bottom: 24px; padding: 22px; }
  .brand-mark { left: 20px; top: 24px; }
  .brand-mark .label-main { font-size: 17px; }
  .hotspot { display: none; }
}
</style>
</head>
<body>

<div class="scene" id="scene">
  <!-- Siluet gardu induk & menara transmisi.
       Ganti dengan foto asli GI Situbondo: set CSS var --photo,
       mis. style="--photo: url('assets/gi-situbondo.jpg')", lalu hapus svg ini. -->
  <svg class="silhouette" viewBox="0 0 1200 500" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <g stroke="#0a1018" stroke-width="3" fill="none" opacity="0.92">
      <path d="M180 500 L220 260 L260 500 M180 500 L260 500 M195 420 L245 420 M200 360 L240 360 M205 310 L235 310"/>
      <line x1="130" y1="270" x2="310" y2="270"/>
      <line x1="150" y1="292" x2="290" y2="292"/>
    </g>
    <g stroke="#0a1018" stroke-width="3" fill="none" opacity="0.88">
      <path d="M700 500 L745 240 L790 500 M700 500 L790 500 M715 430 L775 430 M722 365 L768 365 M728 305 L762 305"/>
      <line x1="640" y1="250" x2="850" y2="250"/>
    </g>
    <g stroke="#0a1018" stroke-width="3" fill="none" opacity="0.82">
      <path d="M980 500 L1015 300 L1050 500 M980 500 L1050 500 M990 420 L1040 420 M995 360 L1035 360"/>
    </g>
    <rect x="380" y="360" width="92" height="140" fill="#0a1018" opacity="0.92"/>
    <rect x="396" y="330" width="14" height="30" fill="#0a1018" opacity="0.92"/>
    <rect x="442" y="330" width="14" height="30" fill="#0a1018" opacity="0.92"/>
    <circle cx="520" cy="410" r="26" fill="none" stroke="#0a1018" stroke-width="3" opacity="0.88"/>
    <line x1="0" y1="500" x2="1200" y2="500" stroke="#0a1018" stroke-width="60" opacity="0.55"/>
  </svg>

  <div class="overlay"></div>

  <!-- Brand mark -->
  <div class="brand-mark">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
    </div>
    <div class="label">
      <span class="label-main">PLN GI Suite</span>
      <span class="label-sub">GI Situbondo</span>
    </div>
  </div>

  <!-- Hotspots interaktif -->
  <div id="hotspot-layer"></div>

  <!-- Login card -->
  <div class="login-card">
    <div class="card-header">
      <h1>Masuk</h1>
      <span class="badge">Internal</span>
    </div>
    <p class="sub">Monitoring &amp; dokumen GI Situbondo</p>

    <div class="divider"></div>

    <form id="login-form" autocomplete="off">
      <div class="field">
        <label for="pw">Kode akses</label>
        <div class="input-wrap">
          <svg class="lock-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/>
          </svg>
          <input id="pw" type="password" placeholder="••••••••" autocomplete="current-password" autofocus>
        </div>
      </div>
      <button type="submit" id="btn-login">
        <span class="spinner"></span>
        <span class="btn-text">Masuk</span>
      </button>
    </form>

    <div class="err" id="err">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      <span id="err-text"></span>
    </div>

    <div class="hint">Akses terbatas tim internal</div>
  </div>
</div>

<script src="shared/api.js"></script>
<script>
  // Hotspots — posisi dalam persen
  const HOTSPOTS = [
    { left: 35, top: 63, title: 'Trafo daya', desc: 'Peralatan utama gardu induk' },
    { left: 43, top: 78, title: 'Bay penghantar', desc: 'Titik sambung ke jalur transmisi' },
    { left: 62, top: 45, title: 'Menara transmisi', desc: '417 tower termonitor' },
    { left: 84, top: 57, title: 'Jalur SUTT 150 kV', desc: '3 penghantar aktif' }
  ];
  const layer = document.getElementById('hotspot-layer');
  layer.innerHTML = HOTSPOTS.map((h) => `
    <div class="hotspot" style="left:${h.left}%; top:${h.top}%;" tabindex="0" role="button" aria-label="${h.title}">
      <div class="tooltip"><strong>${h.title}</strong><span>${h.desc}</span></div>
    </div>`).join('');

  // Login logic
  if (getPassword()) window.location.replace('dashboard.html');

  const form = document.getElementById('login-form');
  const btn = document.getElementById('btn-login');
  const errBox = document.getElementById('err');
  const errText = document.getElementById('err-text');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const pw = document.getElementById('pw').value;
    errBox.classList.remove('visible');
    btn.classList.add('loading'); btn.disabled = true; btn.querySelector('.btn-text').textContent = 'Memeriksa…';
    try {
      const res = await verifyPassword(pw);
      if (res.ok) {
        setPassword(pw);
        window.location.href = 'dashboard.html';
      } else {
        errText.textContent = res.error;
        errBox.classList.add('visible');
        btn.classList.remove('loading'); btn.disabled = false; btn.querySelector('.btn-text').textContent = 'Masuk';
      }
    } catch (err) {
      errText.textContent = 'Tidak bisa menghubungi server: ' + err.message;
      errBox.classList.add('visible');
      btn.classList.remove('loading'); btn.disabled = false; btn.querySelector('.btn-text').textContent = 'Masuk';
    }
  });
</script>
</body>
</html>
