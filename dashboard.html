<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PLN GI Suite — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="shared/tailwind-config.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; vertical-align: middle; }
  body { font-family: 'Inter', sans-serif; }
  h1, h2, h3 { font-family: 'Manrope', sans-serif; }
  #mini-map { width: 100%; height: 100%; background: #e5eeff; }
</style>
</head>
<body class="bg-background text-on-surface h-screen flex overflow-hidden">

  <div id="app-shell" class="flex w-full"></div>

  <template id="dashboard-template">
    <div class="p-8 space-y-8 max-w-[1600px] mx-auto w-full">

      <div id="error-banner" class="hidden bg-error-container border border-error/30 text-on-error-container rounded-lg px-4 py-3 flex items-start gap-2">
        <span class="material-symbols-outlined text-base">error</span>
        <div>
          <p class="font-bold text-xs uppercase tracking-wide mb-0.5">Gagal memuat data</p>
          <p id="error-message" class="text-xs"></p>
        </div>
      </div>

      <!-- Kartu metrik -->
      <div class="grid grid-cols-4 gap-6">
        <div class="bg-surface-container-lowest p-6 rounded shadow-sm border-l-4 border-primary">
          <span class="text-on-surface-variant text-[10px] font-bold uppercase tracking-wider">Total tower</span>
          <div class="mt-1"><span id="m-total" class="text-4xl font-headline font-extrabold text-on-surface">–</span></div>
          <p id="m-total-sub" class="text-[11px] text-on-surface-variant mt-1">&nbsp;</p>
        </div>
        <div class="bg-surface-container-lowest p-6 rounded shadow-sm border-l-4 border-error">
          <span class="text-on-surface-variant text-[10px] font-bold uppercase tracking-wider">Anomali terbuka</span>
          <div class="mt-1"><span id="m-anomali" class="text-4xl font-headline font-extrabold text-on-surface">–</span></div>
          <p id="m-anomali-sub" class="text-[11px] text-on-surface-variant mt-1">&nbsp;</p>
        </div>
        <div class="bg-surface-container-lowest p-6 rounded shadow-sm border-l-4 border-secondary">
          <span class="text-on-surface-variant text-[10px] font-bold uppercase tracking-wider">Kondisi normal</span>
          <div class="mt-1"><span id="m-normal" class="text-4xl font-headline font-extrabold text-on-surface">–</span></div>
          <p id="m-normal-sub" class="text-[11px] text-on-surface-variant mt-1">&nbsp;</p>
        </div>
        <div class="bg-surface-container-lowest p-6 rounded shadow-sm border-l-4 border-tertiary">
          <span class="text-on-surface-variant text-[10px] font-bold uppercase tracking-wider">Gardu Induk</span>
          <div class="mt-1"><span id="m-gi" class="text-2xl font-headline font-extrabold text-on-surface">–</span></div>
          <p id="m-gi-sub" class="text-[11px] text-on-surface-variant mt-1">&nbsp;</p>
        </div>
      </div>

      <!-- Peta ringkas + rincian penghantar -->
      <div class="grid grid-cols-12 gap-6 h-[420px]">
        <div class="col-span-8 bg-surface-container-lowest rounded shadow-sm overflow-hidden relative">
          <div id="mini-map"></div>
          <a href="features/peta-tower/index.html" class="absolute bottom-4 left-4 z-[500] bg-primary text-on-primary rounded shadow-md px-4 py-2.5 flex items-center gap-2 text-xs font-bold">
            <span class="material-symbols-outlined text-sm">open_in_full</span>
            Buka peta lengkap
          </a>
        </div>

        <div class="col-span-4 bg-surface-container-lowest rounded shadow-sm p-6 flex flex-col">
          <h2 class="font-headline font-bold text-base text-on-surface mb-4">Rincian per penghantar</h2>
          <div id="penghantar-breakdown" class="space-y-4 flex-grow overflow-y-auto">
            <p class="text-xs text-on-surface-variant">Memuat…</p>
          </div>
        </div>
      </div>

      <!-- Tabel anomali -->
      <section class="bg-surface-container-lowest rounded shadow-sm border border-outline-variant/10 overflow-hidden">
        <div class="p-6 border-b border-outline-variant/10 flex justify-between items-center bg-surface-container-low/30">
          <div>
            <h2 class="font-headline font-bold text-lg text-on-surface">Anomali terbuka</h2>
            <p class="text-xs text-on-surface-variant mt-0.5">Temuan yang belum ditandai selesai</p>
          </div>
          <a href="features/peta-tower/index.html" class="text-xs font-bold text-primary border border-outline-variant/40 rounded px-3 py-2 hover:bg-surface-container-high">Kelola di peta</a>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="bg-surface-container-low/50">
                <th class="px-6 py-3 text-[10px] font-bold text-on-surface-variant uppercase tracking-widest border-b border-outline-variant/10">Tower</th>
                <th class="px-6 py-3 text-[10px] font-bold text-on-surface-variant uppercase tracking-widest border-b border-outline-variant/10">Jenis anomali</th>
                <th class="px-6 py-3 text-[10px] font-bold text-on-surface-variant uppercase tracking-widest border-b border-outline-variant/10">Lokasi</th>
                <th class="px-6 py-3 text-[10px] font-bold text-on-surface-variant uppercase tracking-widest border-b border-outline-variant/10">Dicatat</th>
              </tr>
            </thead>
            <tbody id="anomali-body" class="divide-y divide-outline-variant/10"></tbody>
          </table>
        </div>
        <div id="anomali-footer" class="p-4 border-t border-outline-variant/10 text-[10px] text-on-surface-variant font-bold uppercase tracking-tighter bg-surface-container-low/20"></div>
      </section>
    </div>
  </template>

  <script src="shared/store.js"></script>
  <script src="shared/format.js"></script>
  <script src="shared/api.js"></script>
  <script src="shared/shell.js"></script>
  <script src="shared/gi-data.js"></script>
  <script>
    const PENGHANTAR_COLOR = {
      'STBDO-PITON': '#1565c0',
      'STBDO-BWNGI': '#6a1b9a',
      'BDWSO-STBDO': '#00695c'
    };
    const GI_FALLBACK = [-7.717441, 114.0191368];

    function showError(msg) {
      const b = document.getElementById('error-banner');
      document.getElementById('error-message').textContent = msg;
      b.classList.remove('hidden');
    }

    function renderMetrics(towers, openMap, profile) {
      const anomaliTowers = towers.filter((t) => t.status === 'anomali');
      const normal = towers.filter((t) => t.status === 'normal').length;
      const penghantarCount = Object.keys(summarizeByPenghantar(towers)).length;

      document.getElementById('m-total').textContent = formatNumber(towers.length);
      document.getElementById('m-total-sub').textContent = `${penghantarCount} penghantar`;

      document.getElementById('m-anomali').textContent = formatNumber(anomaliTowers.length);
      const totalOpen = Object.values(openMap).reduce((s, arr) => s + arr.length, 0);
      document.getElementById('m-anomali-sub').textContent = totalOpen
        ? `${totalOpen} catatan pada ${anomaliTowers.length} tower`
        : 'Tidak ada temuan terbuka';

      document.getElementById('m-normal').textContent = formatNumber(normal);
      const pct = towers.length ? Math.round((normal / towers.length) * 100) : 0;
      document.getElementById('m-normal-sub').textContent = `${pct}% dari total tower`;

      document.getElementById('m-gi').textContent = (profile && profile.nama_gi) || 'GI Situbondo';
      document.getElementById('m-gi-sub').textContent = (profile && profile.tegangan) ? `${profile.tegangan} · ${profile.lokasi || ''}` : '150 kV';
    }

    function renderBreakdown(towers) {
      const box = document.getElementById('penghantar-breakdown');
      const summary = summarizeByPenghantar(towers);
      const keys = Object.keys(summary);
      if (!keys.length) {
        box.innerHTML = '<p class="text-xs text-on-surface-variant">Belum ada data tower.</p>';
        return;
      }
      box.innerHTML = keys.map((ph) => {
        const s = summary[ph];
        const normal = s.total - s.anomali;
        const pctNormal = s.total ? (normal / s.total) * 100 : 0;
        return `
          <div>
            <div class="flex justify-between items-baseline mb-1.5">
              <div class="flex items-center gap-2">
                <span class="w-2.5 h-2.5 rounded" style="background:${PENGHANTAR_COLOR[ph] || '#999'}"></span>
                <span class="text-xs font-bold text-on-surface">${ph}</span>
              </div>
              <span class="text-xs text-on-surface-variant">${s.total} tower</span>
            </div>
            <div class="h-2 w-full bg-surface-container-high rounded overflow-hidden flex">
              <div style="width:${pctNormal}%" class="bg-secondary h-full"></div>
              <div style="width:${100 - pctNormal}%" class="bg-error h-full"></div>
            </div>
            <p class="text-[11px] text-on-surface-variant mt-1">
              ${normal} normal${s.anomali ? ` · <span class="text-error font-bold">${s.anomali} anomali</span>` : ''}
            </p>
          </div>`;
      }).join('');
    }

    function renderAnomaliTable(towers, anomalies) {
      const byId = {};
      towers.forEach((t) => { byId[t.id_tower] = t; });
      const open = anomalies
        .filter((a) => a.status === 'open')
        .sort((a, b) => String(b.timestamp).localeCompare(String(a.timestamp)));

      const body = document.getElementById('anomali-body');
      const footer = document.getElementById('anomali-footer');

      if (!open.length) {
        body.innerHTML = `<tr><td colspan="4" class="px-6 py-10 text-center text-sm text-on-surface-variant">Tidak ada anomali terbuka saat ini.</td></tr>`;
        footer.textContent = '';
        return;
      }

      const shown = open.slice(0, 15);
      body.innerHTML = shown.map((a) => {
        const t = byId[a.id_tower] || {};
        return `
          <tr class="hover:bg-surface-container-low/40 transition-colors">
            <td class="px-6 py-3">
              <div class="text-sm font-bold text-on-surface">${t.penghantar || ''} #${t.nomor || '?'}</div>
              <div class="text-[10px] text-on-surface-variant font-mono">${a.id_tower}</div>
            </td>
            <td class="px-6 py-3">
              <span class="inline-flex items-center gap-1 px-2 py-0.5 bg-error-container text-on-error-container text-[11px] font-bold rounded">${a.jenis_anomali || '-'}</span>
              ${a.catatan ? `<p class="text-[11px] text-on-surface-variant mt-1">${a.catatan}</p>` : ''}
            </td>
            <td class="px-6 py-3 text-sm text-on-surface-variant">${t.alamat || '-'}</td>
            <td class="px-6 py-3">
              <div class="text-xs text-on-surface">${formatDate(a.timestamp)}</div>
              <div class="text-[10px] text-on-surface-variant">${a.oleh || '-'}</div>
            </td>
          </tr>`;
      }).join('');
      footer.textContent = `Menampilkan ${shown.length} dari ${open.length} anomali terbuka`;
    }

    function renderMiniMap(towers, profile) {
      const center = (profile && profile.lat && profile.lng) ? [Number(profile.lat), Number(profile.lng)] : GI_FALLBACK;
      const map = L.map('mini-map', { zoomControl: false, attributionControl: false }).setView(center, 10);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

      L.marker(center, {
        icon: L.divIcon({
          className: '',
          html: `<div style="width:26px;height:26px;background:#8a5300;border:2px solid #fff;border-radius:6px;box-shadow:0 2px 6px rgba(0,0,0,.35);color:#fff;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;">GI</div>`,
          iconSize: [26, 26], iconAnchor: [13, 26]
        })
      }).addTo(map);

      // garis penghantar
      const summary = summarizeByPenghantar(towers);
      Object.keys(summary).forEach((ph) => {
        const pts = towers.filter((t) => t.penghantar === ph && t.lat && t.lng)
          .sort((a, b) => a.nomor - b.nomor).map((t) => [t.lat, t.lng]);
        if (pts.length > 1) L.polyline(pts, { color: PENGHANTAR_COLOR[ph] || '#999', weight: 2, opacity: 0.6 }).addTo(map);
      });

      const towerLayer = L.layerGroup();
      const markers = [];
      const radiusFor = (zoom, status) => {
        const table = { 8: 1.5, 9: 2, 10: 2.5, 11: 3, 12: 4, 13: 5, 14: 6, 15: 7 };
        let r = zoom <= 8 ? 1.5 : (zoom >= 15 ? 8 : table[zoom]);
        return status === 'anomali' ? r + 1.5 : r;
      };

      towers.forEach((t) => {
        if (!t.lat || !t.lng) return;
        const color = t.status === 'anomali' ? '#ba1a1a' : (t.status === 'offline' ? '#747878' : '#006d35');
        const m = L.circleMarker([t.lat, t.lng], {
          radius: radiusFor(map.getZoom(), t.status),
          fillColor: color, fillOpacity: 1, color: '#ffffff', weight: 1
        });
        m.towerStatus = t.status;
        m.addTo(towerLayer);
        markers.push(m);
      });
      towerLayer.addTo(map);
      map.on('zoomend', () => {
        const z = map.getZoom();
        markers.forEach((m) => m.setRadius(radiusFor(z, m.towerStatus)));
      });

      if (towers.length) {
        const bounds = L.latLngBounds(towers.filter((t) => t.lat && t.lng).map((t) => [t.lat, t.lng]));
        if (bounds.isValid()) map.fitBounds(bounds, { padding: [30, 30] });
      }
    }

    async function bootstrapDashboard() {
      const content = document.getElementById('page-content');
      content.innerHTML = '';
      content.appendChild(document.getElementById('dashboard-template').content.cloneNode(true));

      let towers = [], anomalies = [], profile = null;
      try {
        [towers, anomalies, profile] = await Promise.all([
          loadTowers(), loadTowerAnomalies(), loadGIProfile()
        ]);
      } catch (err) {
        showError(err.message);
      }

      const openMap = groupOpenAnomalies(anomalies);
      renderMetrics(towers, openMap, profile);
      renderBreakdown(towers);
      renderAnomaliTable(towers, anomalies);
      renderMiniMap(towers, profile);
    }

    if (requireAuth('')) {
    renderShell({ activeId: 'beranda', pageTitle: 'Dashboard', rootPrefix: '', searchPlaceholder: 'Cari tower, peralatan, atau file...' });
    bootstrapDashboard();
    }
  </script>
</body>
</html>
