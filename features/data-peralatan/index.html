<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PLN GI Suite — Data Peralatan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="../../shared/tailwind-config.js"></script>
<style>
  .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; vertical-align: middle; }
  body { font-family: 'Inter', sans-serif; }
  h1, h2, h3 { font-family: 'Manrope', sans-serif; }
  .modal-backdrop { position: fixed; inset: 0; background: rgba(11,28,48,.45); display: flex; align-items: center; justify-content: center; z-index: 2000; padding: 16px; }
</style>
</head>
<body class="bg-background text-on-surface min-h-screen flex overflow-hidden">

  <div id="app-shell" class="flex w-full"></div>

  <template id="dp-template">
    <div class="p-8 space-y-6 max-w-[1500px] mx-auto w-full">

      <div id="error-banner" class="hidden bg-error-container border border-error/30 text-on-error-container rounded-lg px-4 py-3 flex items-start gap-2">
        <span class="material-symbols-outlined text-base">error</span>
        <div>
          <p class="font-bold text-xs uppercase tracking-wide mb-0.5">Terjadi kesalahan</p>
          <p id="error-message" class="text-xs"></p>
        </div>
      </div>

      <!-- Ringkasan -->
      <div class="grid grid-cols-4 gap-5">
        <div class="bg-surface-container-lowest p-5 rounded shadow-sm border-l-4 border-primary">
          <span class="text-on-surface-variant text-[10px] font-bold uppercase tracking-wider">Total peralatan</span>
          <div class="mt-1"><span id="m-total" class="text-3xl font-headline font-extrabold">–</span></div>
          <p id="m-total-sub" class="text-[11px] text-on-surface-variant mt-0.5">&nbsp;</p>
        </div>
        <div class="bg-surface-container-lowest p-5 rounded shadow-sm border-l-4 border-secondary">
          <span class="text-on-surface-variant text-[10px] font-bold uppercase tracking-wider">Normal</span>
          <div class="mt-1"><span id="m-normal" class="text-3xl font-headline font-extrabold">–</span></div>
          <p id="m-normal-sub" class="text-[11px] text-on-surface-variant mt-0.5">&nbsp;</p>
        </div>
        <div class="bg-surface-container-lowest p-5 rounded shadow-sm border-l-4 border-tertiary">
          <span class="text-on-surface-variant text-[10px] font-bold uppercase tracking-wider">Perlu perhatian</span>
          <div class="mt-1"><span id="m-perhatian" class="text-3xl font-headline font-extrabold">–</span></div>
          <p class="text-[11px] text-on-surface-variant mt-0.5">termasuk yang rusak</p>
        </div>
        <div class="bg-surface-container-lowest p-5 rounded shadow-sm border-l-4 border-outline">
          <span class="text-on-surface-variant text-[10px] font-bold uppercase tracking-wider">Jenis peralatan</span>
          <div class="mt-1"><span id="m-jenis" class="text-3xl font-headline font-extrabold">–</span></div>
          <p class="text-[11px] text-on-surface-variant mt-0.5">kategori terisi</p>
        </div>
      </div>

      <!-- Tabel -->
      <section class="bg-surface-container-lowest rounded shadow-sm border border-outline-variant/10 overflow-hidden">
        <div class="p-5 border-b border-outline-variant/10 bg-surface-container-low/30 flex flex-wrap gap-3 items-center justify-between">
          <div class="flex gap-3 items-center flex-grow min-w-0">
            <div class="relative flex-grow max-w-sm">
              <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-sm">search</span>
              <input id="cari" placeholder="Cari ID, merk, tipe, no. seri, bay…" class="w-full bg-surface-container-low border-none rounded py-2 pl-10 pr-4 text-sm focus:ring-1 focus:ring-primary">
            </div>
            <select id="filter-jenis" class="text-sm border border-outline-variant/40 rounded py-2 px-3 bg-surface-container-lowest">
              <option value="">Semua jenis</option>
            </select>
            <select id="filter-status" class="text-sm border border-outline-variant/40 rounded py-2 px-3 bg-surface-container-lowest">
              <option value="">Semua status</option>
            </select>
          </div>
          <div class="flex gap-2 shrink-0">
            <button id="btn-impor" class="text-xs font-bold text-primary border border-outline-variant/40 rounded px-3 py-2 hover:bg-surface-container-high flex items-center gap-1.5">
              <span class="material-symbols-outlined text-sm">content_paste</span> Impor dari spreadsheet
            </button>
            <button id="btn-tambah" class="text-xs font-bold bg-primary text-on-primary rounded px-4 py-2 flex items-center gap-1.5">
              <span class="material-symbols-outlined text-sm">add</span> Tambah peralatan
            </button>
          </div>
        </div>

        <div class="overflow-x-auto min-h-[320px]">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="bg-surface-container-low/50">
                <th class="px-4 py-3 text-[10px] font-bold text-on-surface-variant uppercase tracking-widest border-b border-outline-variant/10">ID / Bay</th>
                <th class="px-4 py-3 text-[10px] font-bold text-on-surface-variant uppercase tracking-widest border-b border-outline-variant/10">Jenis</th>
                <th class="px-4 py-3 text-[10px] font-bold text-on-surface-variant uppercase tracking-widest border-b border-outline-variant/10">Merk / Tipe</th>
                <th class="px-4 py-3 text-[10px] font-bold text-on-surface-variant uppercase tracking-widest border-b border-outline-variant/10">Kapasitas</th>
                <th class="px-4 py-3 text-[10px] font-bold text-on-surface-variant uppercase tracking-widest border-b border-outline-variant/10">Tahun</th>
                <th class="px-4 py-3 text-[10px] font-bold text-on-surface-variant uppercase tracking-widest border-b border-outline-variant/10">Status</th>
                <th class="px-4 py-3 border-b border-outline-variant/10"></th>
              </tr>
            </thead>
            <tbody id="tbody" class="divide-y divide-outline-variant/10"></tbody>
          </table>
        </div>

        <div id="footer" class="p-4 border-t border-outline-variant/10 text-[10px] text-on-surface-variant font-bold uppercase tracking-tighter bg-surface-container-low/20"></div>
      </section>

      <div id="toast" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 bg-primary text-on-primary text-sm px-4 py-2.5 rounded-lg shadow-lg z-[1500]"></div>
    </div>
  </template>

  <div id="modal-root"></div>

  <script src="../../shared/store.js"></script>
  <script src="../../shared/format.js"></script>
  <script src="../../shared/api.js"></script>
  <script src="../../shared/shell.js"></script>
  <script src="./db.js"></script>
  <script>
    let semua = [], kondisiMap = {};

    const $ = (id) => document.getElementById(id);
    function toast(m, ms = 2800) { const e = $('toast'); e.textContent = m; e.classList.remove('hidden'); setTimeout(() => e.classList.add('hidden'), ms); }
    function showError(m) { $('error-message').textContent = m; $('error-banner').classList.remove('hidden'); }
    function hideError() { $('error-banner').classList.add('hidden'); }
    function closeModal() { $('modal-root').innerHTML = ''; }
    const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

    function statusBadge(key) {
      const map = {
        normal:    ['#c9f5d4', '#007439', 'Normal'],
        perhatian: ['#ffe0b3', '#6e3900', 'Perlu perhatian'],
        rusak:     ['#ffdad6', '#93000a', 'Rusak'],
        nonaktif:  ['#e5e5e5', '#555555', 'Non-aktif']
      };
      const [bg, fg, label] = map[key] || map.normal;
      return `<span class="inline-block px-2 py-0.5 text-[10px] font-bold rounded whitespace-nowrap" style="background:${bg};color:${fg}">${label}</span>`;
    }

    function isiFilter() {
      const fj = $('filter-jenis');
      const jenisAda = [...new Set(semua.map((p) => p.jenis))].sort();
      fj.innerHTML = '<option value="">Semua jenis</option>' +
        jenisAda.map((j) => `<option value="${esc(j)}">${esc(j)}</option>`).join('');
      const fs = $('filter-status');
      if (fs.options.length <= 1) {
        fs.innerHTML = '<option value="">Semua status</option>' +
          STATUS_PERALATAN.map((s) => `<option value="${s.key}">${s.label}</option>`).join('');
      }
    }

    function renderRingkasan() {
      const r = ringkasPeralatan(semua);
      $('m-total').textContent = formatNumber(r.total);
      $('m-total-sub').textContent = r.total ? 'tercatat di daftar induk' : 'belum ada data';
      $('m-normal').textContent = formatNumber(r.perStatus.normal || 0);
      const pct = r.total ? Math.round(((r.perStatus.normal || 0) / r.total) * 100) : 0;
      $('m-normal-sub').textContent = r.total ? pct + '% dari total' : '—';
      $('m-perhatian').textContent = formatNumber((r.perStatus.perhatian || 0) + (r.perStatus.rusak || 0));
      $('m-jenis').textContent = formatNumber(Object.keys(r.perJenis).length);
    }

    function renderTabel() {
      const q = $('cari').value.trim().toLowerCase();
      const fj = $('filter-jenis').value;
      const fs = $('filter-status').value;

      const data = semua.filter((p) => {
        if (fj && p.jenis !== fj) return false;
        if (fs && p.status !== fs) return false;
        if (!q) return true;
        return [p.id_peralatan, p.bay, p.merk, p.tipe, p.no_seri, p.kapasitas]
          .join(' ').toLowerCase().includes(q);
      });

      const tb = $('tbody');
      if (!data.length) {
        tb.innerHTML = `<tr><td colspan="7" class="px-6 py-16 text-center">
          <span class="material-symbols-outlined text-4xl text-outline-variant">inventory_2</span>
          <p class="text-sm text-on-surface-variant mt-2">${semua.length ? 'Tidak ada peralatan yang cocok dengan filter.' : 'Belum ada data peralatan.'}</p>
          ${semua.length ? '' : '<p class="text-xs text-outline mt-1">Tambahkan satu per satu, atau impor dari spreadsheet.</p>'}
        </td></tr>`;
        $('footer').textContent = '';
        return;
      }

      tb.innerHTML = data.map((p) => {
        const riwayat = (kondisiMap[p.id_peralatan] || []).length;
        return `
        <tr class="hover:bg-surface-container-low/40">
          <td class="px-4 py-3">
            <div class="text-sm font-bold font-mono">${esc(p.id_peralatan)}</div>
            ${p.bay ? `<div class="text-[11px] text-on-surface-variant">Bay ${esc(p.bay)}</div>` : ''}
          </td>
          <td class="px-4 py-3 text-xs">${esc(p.jenis)}</td>
          <td class="px-4 py-3">
            <div class="text-xs">${esc(p.merk) || '–'}</div>
            ${p.tipe ? `<div class="text-[11px] text-on-surface-variant">${esc(p.tipe)}</div>` : ''}
          </td>
          <td class="px-4 py-3 text-xs">${esc(p.kapasitas) || '–'}</td>
          <td class="px-4 py-3 text-xs">${esc(p.tahun_pasang) || '–'}</td>
          <td class="px-4 py-3">${statusBadge(p.status)}</td>
          <td class="px-4 py-3 text-right whitespace-nowrap">
            <button data-riwayat="${esc(p.id_peralatan)}" class="inline-flex items-center gap-1 px-2 py-1.5 text-[10px] font-bold text-primary hover:bg-surface-container-high rounded" title="Riwayat kondisi">
              <span class="material-symbols-outlined text-sm">history</span>${riwayat || ''}
            </button>
            <button data-edit="${esc(p.id_peralatan)}" class="inline-flex p-1.5 text-on-surface-variant hover:text-primary" title="Ubah"><span class="material-symbols-outlined text-base">edit</span></button>
            <button data-hapus="${esc(p.id_peralatan)}" class="inline-flex p-1.5 text-on-surface-variant hover:text-error" title="Hapus"><span class="material-symbols-outlined text-base">delete</span></button>
          </td>
        </tr>`;
      }).join('');

      $('footer').textContent = `Menampilkan ${data.length} dari ${semua.length} peralatan`;

      tb.querySelectorAll('[data-edit]').forEach((b) => b.addEventListener('click', () => formPeralatan(b.dataset.edit)));
      tb.querySelectorAll('[data-hapus]').forEach((b) => b.addEventListener('click', () => konfirmasiHapus(b.dataset.hapus)));
      tb.querySelectorAll('[data-riwayat]').forEach((b) => b.addEventListener('click', () => panelRiwayat(b.dataset.riwayat)));
    }

    // ---------- Form tambah / ubah ----------
    function formPeralatan(id) {
      const p = id ? semua.find((x) => x.id_peralatan === id) : null;
      const f = (k) => esc(p ? p[k] : '');
      $('modal-root').innerHTML = `
        <div class="modal-backdrop">
          <div class="bg-white rounded-lg shadow-xl w-[520px] max-h-[88vh] overflow-y-auto p-6">
            <h2 class="font-headline font-bold text-lg text-[#0b1c30] mb-4">${p ? 'Ubah peralatan' : 'Tambah peralatan'}</h2>
            <form id="form-p" class="space-y-3">
              <div class="grid grid-cols-2 gap-3">
                <div>
                  <label class="block text-[11px] font-bold text-gray-500 uppercase mb-1">ID peralatan *</label>
                  <input name="id_peralatan" value="${f('id_peralatan')}" placeholder="mis. TRF-01" class="w-full border border-gray-300 rounded px-3 py-2 text-sm font-mono" required>
                </div>
                <div>
                  <label class="block text-[11px] font-bold text-gray-500 uppercase mb-1">Bay / Penyulang</label>
                  <input name="bay" value="${f('bay')}" placeholder="mis. Bay Trafo 1" class="w-full border border-gray-300 rounded px-3 py-2 text-sm">
                </div>
              </div>
              <div>
                <label class="block text-[11px] font-bold text-gray-500 uppercase mb-1">Jenis *</label>
                <select name="jenis" class="w-full border border-gray-300 rounded px-3 py-2 text-sm" required>
                  ${JENIS_PERALATAN.map((j) => `<option ${p && p.jenis === j ? 'selected' : ''}>${esc(j)}</option>`).join('')}
                </select>
              </div>
              <div class="grid grid-cols-2 gap-3">
                <div>
                  <label class="block text-[11px] font-bold text-gray-500 uppercase mb-1">Merk</label>
                  <input name="merk" value="${f('merk')}" class="w-full border border-gray-300 rounded px-3 py-2 text-sm">
                </div>
                <div>
                  <label class="block text-[11px] font-bold text-gray-500 uppercase mb-1">Tipe</label>
                  <input name="tipe" value="${f('tipe')}" class="w-full border border-gray-300 rounded px-3 py-2 text-sm">
                </div>
              </div>
              <div class="grid grid-cols-3 gap-3">
                <div>
                  <label class="block text-[11px] font-bold text-gray-500 uppercase mb-1">No. seri</label>
                  <input name="no_seri" value="${f('no_seri')}" class="w-full border border-gray-300 rounded px-3 py-2 text-sm">
                </div>
                <div>
                  <label class="block text-[11px] font-bold text-gray-500 uppercase mb-1">Kapasitas</label>
                  <input name="kapasitas" value="${f('kapasitas')}" placeholder="60 MVA" class="w-full border border-gray-300 rounded px-3 py-2 text-sm">
                </div>
                <div>
                  <label class="block text-[11px] font-bold text-gray-500 uppercase mb-1">Tahun pasang</label>
                  <input name="tahun_pasang" value="${f('tahun_pasang')}" placeholder="1998" class="w-full border border-gray-300 rounded px-3 py-2 text-sm">
                </div>
              </div>
              <div>
                <label class="block text-[11px] font-bold text-gray-500 uppercase mb-1">Status</label>
                <select name="status" class="w-full border border-gray-300 rounded px-3 py-2 text-sm">
                  ${STATUS_PERALATAN.map((s) => `<option value="${s.key}" ${p && p.status === s.key ? 'selected' : ''}>${s.label}</option>`).join('')}
                </select>
              </div>
              <div>
                <label class="block text-[11px] font-bold text-gray-500 uppercase mb-1">Catatan</label>
                <textarea name="catatan" rows="2" class="w-full border border-gray-300 rounded px-3 py-2 text-sm">${f('catatan')}</textarea>
              </div>
              <div class="flex gap-2 pt-2">
                <button type="button" id="batal" class="flex-1 border border-gray-300 rounded py-2 text-sm font-medium">Batal</button>
                <button type="submit" class="flex-1 bg-[#0b1c30] text-white rounded py-2 text-sm font-bold">Simpan</button>
              </div>
            </form>
          </div>
        </div>`;
      $('batal').addEventListener('click', closeModal);
      $('form-p').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = e.target.querySelector('[type=submit]');
        btn.disabled = true; btn.textContent = 'Menyimpan…';
        const data = Object.fromEntries(new FormData(e.target).entries());
        data.id_peralatan = data.id_peralatan.trim();
        try {
          if (p) {
            await updatePeralatan(p.id_peralatan, data);
          } else {
            if (semua.some((x) => x.id_peralatan === data.id_peralatan)) {
              throw new Error(`ID "${data.id_peralatan}" sudah dipakai peralatan lain`);
            }
            await addPeralatan(data);
          }
          closeModal();
          await muat();
          toast(p ? 'Peralatan diperbarui' : 'Peralatan ditambahkan');
        } catch (err) {
          btn.disabled = false; btn.textContent = 'Simpan';
          alert('Gagal menyimpan: ' + err.message);
        }
      });
    }

    function konfirmasiHapus(id) {
      const jml = (kondisiMap[id] || []).length;
      $('modal-root').innerHTML = `
        <div class="modal-backdrop">
          <div class="bg-white rounded-lg shadow-xl w-[400px] p-6">
            <h2 class="font-headline font-bold text-lg text-[#0b1c30] mb-2">Hapus peralatan?</h2>
            <p class="text-sm text-gray-700 mb-2 font-mono">${esc(id)}</p>
            <p class="text-xs text-gray-500 mb-4">Hanya baris di daftar induk yang dihapus.${jml ? ` Riwayat kondisinya (${jml} catatan) tetap tersimpan di sheet kondisi_log.` : ''}</p>
            <div class="flex gap-2">
              <button id="batal" class="flex-1 border border-gray-300 rounded py-2 text-sm font-medium">Batal</button>
              <button id="ya" class="flex-1 bg-[#ba1a1a] text-white rounded py-2 text-sm font-bold">Hapus</button>
            </div>
          </div>
        </div>`;
      $('batal').addEventListener('click', closeModal);
      $('ya').addEventListener('click', async (e) => {
        e.target.disabled = true; e.target.textContent = 'Menghapus…';
        try { await deletePeralatan(id); closeModal(); await muat(); toast('Peralatan dihapus'); }
        catch (err) { closeModal(); showError('Gagal menghapus: ' + err.message); }
      });
    }

    // ---------- Riwayat kondisi ----------
    function panelRiwayat(id) {
      const p = semua.find((x) => x.id_peralatan === id);
      const logs = kondisiMap[id] || [];
      const labelOf = (k) => (STATUS_PERALATAN.find((s) => s.key === k) || {}).label || k;
      $('modal-root').innerHTML = `
        <div class="modal-backdrop">
          <div class="bg-white rounded-lg shadow-xl w-[560px] max-h-[88vh] flex flex-col">
            <div class="p-5 border-b border-gray-200">
              <h2 class="font-headline font-bold text-lg text-[#0b1c30]">Riwayat kondisi</h2>
              <p class="text-xs text-gray-500 font-mono mt-0.5">${esc(id)} — ${esc(p ? p.jenis : '')}</p>
            </div>
            <div class="p-5 border-b border-gray-200 bg-gray-50">
              <form id="form-k" class="space-y-3">
                <div class="grid grid-cols-2 gap-3">
                  <div>
                    <label class="block text-[11px] font-bold text-gray-500 uppercase mb-1">Hasil pemeriksaan</label>
                    <select name="kondisi" class="w-full border border-gray-300 rounded px-3 py-2 text-sm" required>
                      ${STATUS_PERALATAN.map((s) => `<option value="${s.key}">${s.label}</option>`).join('')}
                    </select>
                  </div>
                  <div>
                    <label class="block text-[11px] font-bold text-gray-500 uppercase mb-1">Diperiksa oleh</label>
                    <input name="oleh" value="Wisnu" class="w-full border border-gray-300 rounded px-3 py-2 text-sm">
                  </div>
                </div>
                <div>
                  <label class="block text-[11px] font-bold text-gray-500 uppercase mb-1">Catatan</label>
                  <textarea name="catatan" rows="2" placeholder="Temuan saat pemeriksaan…" class="w-full border border-gray-300 rounded px-3 py-2 text-sm"></textarea>
                </div>
                <button type="submit" class="w-full bg-[#0b1c30] text-white rounded py-2 text-sm font-bold">Catat pemeriksaan</button>
              </form>
              <p class="text-[11px] text-gray-500 mt-2">Status peralatan di daftar induk akan mengikuti hasil pemeriksaan terakhir.</p>
            </div>
            <div class="overflow-y-auto flex-grow p-5">
              ${logs.length ? logs.map((l) => `
                <div class="border-l-2 pl-3 pb-4 relative" style="border-color:#c4c7c7">
                  <div class="flex items-center gap-2 mb-1">
                    ${statusBadge(l.kondisi)}
                    <span class="text-[11px] text-gray-500">${formatDateTime(l.timestamp)}</span>
                  </div>
                  ${l.catatan ? `<p class="text-xs text-gray-700">${esc(l.catatan)}</p>` : ''}
                  <p class="text-[10px] text-gray-400 mt-0.5">${esc(l.oleh) || '–'}</p>
                </div>`).join('')
                : '<p class="text-sm text-gray-500 text-center py-8">Belum ada riwayat pemeriksaan.</p>'}
            </div>
            <div class="p-4 border-t border-gray-200">
              <button id="tutup" class="w-full border border-gray-300 rounded py-2 text-sm font-medium">Tutup</button>
            </div>
          </div>
        </div>`;
      $('tutup').addEventListener('click', closeModal);
      $('form-k').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = e.target.querySelector('[type=submit]');
        btn.disabled = true; btn.textContent = 'Menyimpan…';
        const d = Object.fromEntries(new FormData(e.target).entries());
        try {
          await addKondisi({ id_peralatan: id, ...d });
          closeModal();
          await muat();
          toast('Pemeriksaan tercatat');
        } catch (err) {
          btn.disabled = false; btn.textContent = 'Catat pemeriksaan';
          alert('Gagal menyimpan: ' + err.message);
        }
      });
    }

    // ---------- Impor massal ----------
    function panelImpor() {
      $('modal-root').innerHTML = `
        <div class="modal-backdrop">
          <div class="bg-white rounded-lg shadow-xl w-[620px] max-h-[88vh] overflow-y-auto p-6">
            <h2 class="font-headline font-bold text-lg text-[#0b1c30] mb-1">Impor dari spreadsheet</h2>
            <p class="text-xs text-gray-500 mb-3">Salin baris dari Excel/Google Sheets, lalu tempel di bawah. Urutan kolom harus:</p>
            <div class="bg-gray-50 border border-gray-200 rounded p-2.5 mb-3 text-[11px] font-mono text-gray-600 overflow-x-auto whitespace-nowrap">
              ID · Jenis · Bay · Merk · Tipe · No. seri · Kapasitas · Tahun · Status
            </div>
            <textarea id="tempel" rows="9" placeholder="TRF-01&#9;Transformator Daya&#9;Bay Trafo 1&#9;Unindo&#9;TTUL&#9;12345&#9;60 MVA&#9;1998&#9;normal" class="w-full border border-gray-300 rounded px-3 py-2 text-xs font-mono"></textarea>
            <div id="pratinjau" class="mt-3 text-xs"></div>
            <div class="mt-3 p-3 bg-gray-50 border border-gray-200 rounded">
              <label class="flex items-start gap-2 text-xs cursor-pointer mb-2">
                <input type="radio" name="mode" value="tambah" checked class="mt-0.5">
                <span><b>Tambahkan</b> — data lama dipertahankan, ID yang sudah ada dilewati</span>
              </label>
              <label class="flex items-start gap-2 text-xs cursor-pointer">
                <input type="radio" name="mode" value="ganti" class="mt-0.5">
                <span><b>Ganti seluruhnya</b> — <span class="text-red-700">seluruh daftar induk ditimpa</span></span>
              </label>
            </div>
            <div class="flex gap-2 mt-4">
              <button id="batal" class="flex-1 border border-gray-300 rounded py-2 text-sm font-medium">Batal</button>
              <button id="ya" class="flex-1 bg-[#0b1c30] text-white rounded py-2 text-sm font-bold" disabled>Impor</button>
            </div>
          </div>
        </div>`;
      $('batal').addEventListener('click', closeModal);

      let hasilParse = [];
      $('tempel').addEventListener('input', (e) => {
        const { hasil, ditolak } = parseTempelan(e.target.value);
        hasilParse = hasil;
        $('ya').disabled = !hasil.length;
        if (!e.target.value.trim()) { $('pratinjau').innerHTML = ''; return; }
        $('pratinjau').innerHTML = `
          <p class="font-bold text-gray-700 mb-1">${hasil.length} baris terbaca${ditolak.length ? `, ${ditolak.length} dilewati` : ''}</p>
          ${hasil.slice(0, 4).map((h) => `<div class="text-[11px] text-gray-600 font-mono">${esc(h.id_peralatan)} · ${esc(h.jenis)} · ${esc(h.merk)}</div>`).join('')}
          ${hasil.length > 4 ? `<div class="text-[11px] text-gray-400">…dan ${hasil.length - 4} lainnya</div>` : ''}`;
      });

      $('ya').addEventListener('click', async (e) => {
        e.target.disabled = true; e.target.textContent = 'Mengimpor…';
        const mode = document.querySelector('input[name=mode]:checked').value;
        try {
          const n = await imporPeralatan(hasilParse, mode);
          closeModal();
          await muat();
          toast(mode === 'ganti' ? `${n} peralatan diimpor (data lama diganti)` : `${n} peralatan baru ditambahkan`, 4000);
        } catch (err) {
          closeModal();
          showError('Gagal impor: ' + err.message);
        }
      });
    }

    // ---------- Bootstrap ----------
    async function muat() {
      try {
        const [list, logs] = await Promise.all([loadPeralatan(), loadKondisiLog()]);
        semua = list;
        kondisiMap = groupKondisi(logs);
        hideError();
      } catch (err) {
        semua = []; kondisiMap = {};
        showError(err.message);
      }
      isiFilter();
      renderRingkasan();
      renderTabel();
    }

    async function bootstrap() {
      const c = $('page-content');
      c.innerHTML = '';
      c.appendChild($('dp-template').content.cloneNode(true));

      $('btn-tambah').addEventListener('click', () => formPeralatan(null));
      $('btn-impor').addEventListener('click', panelImpor);
      $('cari').addEventListener('input', renderTabel);
      $('filter-jenis').addEventListener('change', renderTabel);
      $('filter-status').addEventListener('change', renderTabel);

      await muat();
    }

    if (requireAuth('../../')) {
      renderShell({ activeId: 'data-peralatan', pageTitle: 'Data Peralatan', rootPrefix: '../../', searchPlaceholder: 'Cari peralatan...' });
      bootstrap();
    }
  </script>
</body>
</html>
