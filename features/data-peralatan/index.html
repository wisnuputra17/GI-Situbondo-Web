<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PLN GI Suite — Data Peralatan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="../../shared/tailwind-config.js"></script>
<style>
  .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; vertical-align: middle; }
  body { font-family: 'Inter', sans-serif; }
  h1, h2, h3 { font-family: 'Manrope', sans-serif; }
  .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; z-index: 2000; padding: 16px; }
  .blok-inisial { display: flex; align-items: center; justify-content: center; font-family: 'Manrope'; font-weight: 800; letter-spacing: -.02em; }
</style>
</head>
<body class="bg-background text-on-surface h-screen flex overflow-hidden">

  <div id="app-shell" class="flex w-full"></div>

  <template id="dp-template">
    <div class="flex flex-grow overflow-hidden">

      <!-- ══ PANEL TENGAH · kategori ══ -->
      <aside id="panel-tengah" class="w-72 shrink-0 border-r border-outline-variant/25 bg-surface-container-low flex flex-col">
        <div class="p-4 border-b border-outline-variant/20 flex items-center gap-2">
          <span class="material-symbols-outlined text-tertiary text-lg">category</span>
          <h2 class="font-headline font-bold text-sm">Kategori Aset</h2>
        </div>
        <div class="p-3">
          <div class="relative">
            <span class="material-symbols-outlined absolute left-2.5 top-1/2 -translate-y-1/2 text-on-surface-variant text-sm">search</span>
            <input id="cari-kategori" placeholder="Cari kategori…" class="w-full bg-surface-container border-none rounded-lg py-2 pl-9 pr-3 text-[13px] text-on-surface placeholder:text-on-surface-variant/60 focus:ring-1 focus:ring-primary">
          </div>
        </div>
        <nav id="daftar-kategori" class="px-2 pb-3 space-y-0.5 overflow-y-auto flex-grow"></nav>
      </aside>

      <!-- ══ PANEL KANAN · isi ══ -->
      <div class="flex-grow flex flex-col overflow-hidden">

        <div class="px-6 py-4 border-b border-outline-variant/20 flex items-center justify-between gap-4 flex-wrap">
          <div>
            <h1 id="judul-isi" class="font-headline font-bold text-lg">Semua Aset</h1>
            <p id="sub-isi" class="text-[11px] text-on-surface-variant mt-0.5">&nbsp;</p>
          </div>
          <div id="tab-status" class="flex bg-surface-container-low rounded-lg p-1 gap-0.5"></div>
        </div>

        <div class="px-6 py-3 border-b border-outline-variant/20 flex items-center gap-3 flex-wrap">
          <button id="btn-muat" class="p-2 rounded-lg bg-surface-container-low hover:bg-surface-container-high text-on-surface-variant" title="Muat ulang">
            <span class="material-symbols-outlined text-base">refresh</span>
          </button>
          <div class="relative flex-grow max-w-sm">
            <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-sm">search</span>
            <input id="cari" placeholder="Cari…" class="w-full bg-surface-container-low border-none rounded-lg py-2 pl-10 pr-4 text-sm text-on-surface placeholder:text-on-surface-variant/60 focus:ring-1 focus:ring-primary">
          </div>
          <div class="flex-grow"></div>
          <span id="hitungan" class="text-xs font-bold px-3 py-2 rounded-lg bg-surface-container-low text-on-surface-variant">Total: –</span>
          <div class="flex bg-surface-container-low rounded-lg p-1 gap-0.5">
            <button id="v-tabel" class="p-1.5 rounded text-on-surface-variant" title="Tampilan tabel"><span class="material-symbols-outlined text-base">table_rows</span></button>
            <button id="v-grid" class="p-1.5 rounded text-on-surface-variant" title="Tampilan kartu"><span class="material-symbols-outlined text-base">grid_view</span></button>
          </div>
          <button id="btn-impor" class="text-xs font-bold text-primary border border-outline-variant/40 rounded-lg px-3 py-2 hover:bg-surface-container-high flex items-center gap-1.5">
            <span class="material-symbols-outlined text-sm">content_paste</span> Impor
          </button>
          <button id="btn-tambah" class="text-xs font-bold bg-primary text-on-primary rounded-lg px-4 py-2 flex items-center gap-1.5">
            <span class="material-symbols-outlined text-sm">add</span> Tambah
          </button>
        </div>

        <div id="error-banner" class="hidden mx-6 mt-4 bg-error-container border border-error/30 text-on-error-container rounded-lg px-4 py-3 flex items-start gap-2">
          <span class="material-symbols-outlined text-base">error</span>
          <div><p class="font-bold text-xs uppercase tracking-wide mb-0.5">Terjadi kesalahan</p><p id="error-message" class="text-xs"></p></div>
        </div>

        <div id="isi" class="flex-grow overflow-y-auto p-6"></div>
      </div>
    </div>

    <div id="toast" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 bg-primary text-on-primary text-sm px-4 py-2.5 rounded-lg shadow-lg z-[1500]"></div>
  </template>

  <div id="modal-root"></div>

  <script src="../../shared/store.js"></script>
  <script src="../../shared/format.js"></script>
  <script src="../../shared/api.js"></script>
  <script src="../../shared/shell.js"></script>
  <script src="./jaring-seed.js"></script>
  <script src="./db.js"></script>
  <script>
    // ---------- state ----------
    let switchgear = [], jaring = [], kondisiMap = {}, kerusakanMap = {};
    let kategori = 'semua';       // 'semua' | 'switchgear' | 'jaring' | 'j:<jenis>'
    let statusAktif = '';
    let tampilan = localStorage.getItem('pln_gi_dp_view') || 'grid';

    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    function toast(m, ms = 2800) { const e = $('toast'); e.textContent = m; e.classList.remove('hidden'); setTimeout(() => e.classList.add('hidden'), ms); }
    function showError(m) { $('error-message').textContent = m; $('error-banner').classList.remove('hidden'); }
    function hideError() { $('error-banner').classList.add('hidden'); }
    function closeModal() { $('modal-root').innerHTML = ''; }

    function statusBadge(key) {
      const cls = {
        normal: 'bg-secondary-container text-on-secondary-container',
        perhatian: 'bg-tertiary-container text-on-tertiary-container',
        rusak: 'bg-error-container text-on-error-container',
        nonaktif: 'bg-surface-container-highest text-on-surface-variant'
      }[key] || 'bg-surface-container-highest text-on-surface-variant';
      const label = (STATUS_PERALATAN.find((s) => s.key === key) || {}).label || key;
      return `<span class="inline-block px-2 py-0.5 text-[10px] font-bold rounded whitespace-nowrap ${cls}">${label}</span>`;
    }

    // ---------- panel tengah ----------
    function renderKategori() {
      const q = $('cari-kategori').value.trim().toLowerCase();
      const perJenis = {};
      switchgear.forEach((p) => { perJenis[p.jenis] = (perJenis[p.jenis] || 0) + 1; });

      const item = (id, label, jml, ikon, indent) => {
        const aktif = kategori === id;
        return `
          <button data-kat="${esc(id)}" class="w-full flex items-center gap-2.5 rounded-lg text-left transition-colors
            ${indent ? 'pl-8 pr-3 py-1.5' : 'px-3 py-2.5'}
            ${aktif ? 'bg-primary text-on-primary' : 'text-on-surface-variant hover:bg-surface-container-high'}">
            ${ikon ? `<span class="material-symbols-outlined text-base">${ikon}</span>`
                   : `<span class="w-1.5 h-1.5 rounded-full ${aktif ? 'bg-on-primary' : 'bg-outline'}"></span>`}
            <span class="flex-grow ${indent ? 'text-[12.5px]' : 'text-[13.5px] font-medium'} truncate">${esc(label)}</span>
            <span class="text-[11px] ${aktif ? 'opacity-80' : 'opacity-60'} tabular-nums">${jml}</span>
          </button>`;
      };

      const cocok = (t) => !q || t.toLowerCase().includes(q);
      let html = '';
      if (cocok('semua aset')) html += item('semua', 'Semua Aset', switchgear.length + jaring.length, 'apps');
      if (cocok('switchgear')) {
        html += item('switchgear', 'Switchgear', switchgear.length, 'electrical_services');
        html += Object.keys(perJenis).sort()
          .filter((j) => cocok(j))
          .map((j) => item('j:' + j, j, perJenis[j], null, true)).join('');
      } else {
        html += Object.keys(perJenis).sort().filter((j) => cocok(j))
          .map((j) => item('j:' + j, j, perJenis[j], null, true)).join('');
      }
      if (cocok('jaring layang-layang')) html += item('jaring', 'Jaring Layang-layang', jaring.length, 'grid_on');

      $('daftar-kategori').innerHTML = html || `<p class="px-3 py-4 text-xs text-on-surface-variant">Tidak ada kategori yang cocok.</p>`;
      $('daftar-kategori').querySelectorAll('[data-kat]').forEach((b) =>
        b.addEventListener('click', () => { kategori = b.dataset.kat; statusAktif = ''; renderSemua(); }));
    }

    // ---------- data terfilter ----------
    function modeJaring() { return kategori === 'jaring'; }

    function dataTampil() {
      const q = $('cari').value.trim().toLowerCase();
      let data;
      if (kategori === 'jaring') data = jaring.slice();
      else if (kategori === 'semua') data = switchgear.slice();
      else if (kategori === 'switchgear') data = switchgear.slice();
      else data = switchgear.filter((p) => p.jenis === kategori.slice(2));

      if (statusAktif) data = data.filter((d) => d.status === statusAktif);
      if (q) {
        data = data.filter((d) => Object.values(d).join(' ').toLowerCase().includes(q));
      }
      return data;
    }

    function renderTab() {
      if (modeJaring()) { $('tab-status').innerHTML = ''; return; } // filter lewat legenda denah
      const sumber = (kategori === 'semua' || kategori === 'switchgear')
        ? switchgear : switchgear.filter((p) => p.jenis === kategori.slice(2));
      const hit = { '': sumber.length };
      STATUS_PERALATAN.forEach((s) => { hit[s.key] = sumber.filter((d) => d.status === s.key).length; });

      const tabs = [{ key: '', label: 'Semua' }, ...STATUS_PERALATAN.filter((s) => hit[s.key] > 0 || s.key === 'normal')];
      $('tab-status').innerHTML = tabs.map((t) => `
        <button data-status="${t.key}" class="px-3 py-1.5 rounded-md text-xs font-bold transition-colors
          ${statusAktif === t.key ? 'bg-primary text-on-primary' : 'text-on-surface-variant hover:bg-surface-container-high'}">
          ${t.label}${hit[t.key] ? ` <span class="opacity-70">${hit[t.key]}</span>` : ''}
        </button>`).join('');
      $('tab-status').querySelectorAll('[data-status]').forEach((b) =>
        b.addEventListener('click', () => { statusAktif = b.dataset.status; renderSemua(); }));
    }

    // ---------- kartu ----------
    function kartuSwitchgear(p) {
      const [bg, fg] = warnaBlok(p.jenis);
      const riwayat = (kondisiMap[p.id_peralatan] || []).length;
      return `
        <article data-buka="${esc(p.id_peralatan)}" class="bg-surface-container-lowest border border-outline-variant/20 rounded-xl overflow-hidden cursor-pointer hover:border-primary/50 transition-colors group">
          <div class="blok-inisial h-28" style="background:${bg};color:${fg}">
            <span class="text-2xl">${esc(inisialJenis(p.jenis))}</span>
          </div>
          <div class="p-4">
            <h3 class="font-headline font-bold text-sm truncate group-hover:text-primary transition-colors">${esc(p.id_peralatan)}</h3>
            <div class="mt-1.5 mb-2">
              <span class="inline-block px-2 py-0.5 text-[10px] font-bold rounded" style="background:${bg}33;color:${fg}">${esc(p.jenis)}</span>
            </div>
            <p class="text-[11.5px] text-on-surface-variant leading-snug line-clamp-2 min-h-[2.4em]">
              ${esc([p.merk, p.tipe, p.kapasitas].filter(Boolean).join(' · ')) || 'Belum ada rincian merk/tipe.'}
            </p>
            <div class="mt-3 pt-3 border-t border-outline-variant/20 flex items-center justify-between gap-2">
              <span class="text-[11px] text-on-surface-variant">${esc(p.bay) || (p.tahun_pasang ? 'Th. ' + esc(p.tahun_pasang) : '–')}</span>
              <div class="flex items-center gap-1.5">
                ${riwayat ? `<span class="text-[10px] text-on-surface-variant flex items-center gap-0.5"><span class="material-symbols-outlined text-xs">history</span>${riwayat}</span>` : ''}
                ${statusBadge(p.status)}
              </div>
            </div>
          </div>
        </article>`;
    }

    // ---------- DENAH JARING ----------
    // Digambar sebagai SVG grid 8x9 mengikuti denah asli. Tiap kotak = satu
    // jaring; warnanya mengikuti kondisi (hijau/kuning/merah/abu-abu).
    function renderDenah() {
      const CELL = 92, GAP = 10, PAD_X = 118, PAD_Y = 74;
      const W = PAD_X * 2 + DENAH_KOLOM * CELL + (DENAH_KOLOM - 1) * GAP;
      const H = PAD_Y * 2 + DENAH_BARIS * CELL + (DENAH_BARIS - 1) * GAP;
      const cx = (k) => PAD_X + k * (CELL + GAP);
      const cy = (b) => PAD_Y + b * (CELL + GAP);

      const peta = {};
      jaring.forEach((j) => { peta[j.baris + ',' + j.kolom] = j; });

      const q = $('cari').value.trim().toLowerCase();
      const cocok = (j) => {
        if (statusAktif && j.kondisi !== statusAktif) return false;
        if (!q) return true;
        return [j.id_jaring, j.bay, j.ukuran, j.catatan].join(' ').toLowerCase().includes(q);
      };

      let kotak = '';
      for (let b = 0; b < DENAH_BARIS; b++) {
        for (let k = 0; k < DENAH_KOLOM; k++) {
          const j = peta[b + ',' + k];
          if (!j) continue;
          const w = warnaKondisi(j.kondisi);
          const redup = !cocok(j);
          const jmlRusak = (kerusakanMap[j.id_jaring] || []).filter((x) => x.kondisi !== 'normal').length;
          const usia = usiaJaring(j.tahun_pasang);
          kotak += `
            <g class="kotak-jaring" data-jaring="${esc(j.id_jaring)}" style="cursor:pointer;opacity:${redup ? .22 : 1}">
              <rect x="${cx(k)}" y="${cy(b)}" width="${CELL}" height="${CELL}" rx="7"
                    fill="${w.warna}" fill-opacity=".93" stroke="rgba(0,0,0,.4)" stroke-width="1.5"/>
              <text x="${cx(k) + CELL / 2}" y="${cy(b) + 30}" text-anchor="middle"
                    font-size="15" font-weight="800" fill="${w.teks}" font-family="Manrope">${esc(j.id_jaring)}</text>
              <text x="${cx(k) + CELL / 2}" y="${cy(b) + 50}" text-anchor="middle"
                    font-size="12.5" fill="${w.teks}" opacity=".92" font-family="Inter">${esc(j.ukuran)} m</text>
              ${j.bay ? `<text x="${cx(k) + CELL / 2}" y="${cy(b) + 69}" text-anchor="middle"
                    font-size="11" font-weight="600" fill="${w.teks}" opacity=".8" font-family="Inter">${esc(j.bay)}</text>` : ''}
              ${j.samping ? `<text x="${cx(k) + CELL - 7}" y="${cy(b) + 15}" text-anchor="end"
                    font-size="9" fill="${w.teks}" opacity=".75" font-family="Inter">SPG</text>` : ''}
              ${jmlRusak ? `<circle cx="${cx(k) + 13}" cy="${cy(b) + 13}" r="7.5" fill="#7f1d1d"/>
                    <text x="${cx(k) + 13}" y="${cy(b) + 17}" text-anchor="middle" font-size="10"
                    font-weight="700" fill="#fff" font-family="Inter">${jmlRusak}</text>` : ''}
              ${usia !== null && usia >= 10 ? `<circle cx="${cx(k) + CELL - 13}" cy="${cy(b) + CELL - 13}" r="7.5" fill="#78350f"/>
                    <text x="${cx(k) + CELL - 13}" y="${cy(b) + CELL - 9}" text-anchor="middle" font-size="9"
                    font-weight="700" fill="#fde68a" font-family="Inter">U</text>` : ''}
            </g>`;
        }
      }

      // label bay di atas & di bawah grid
      let label = '';
      Object.keys(BAY_ATAS).forEach((k) => {
        label += `<text x="${cx(+k) + CELL / 2}" y="${PAD_Y - 30}" text-anchor="middle" font-size="13"
          font-weight="800" fill="currentColor" font-family="Manrope">${BAY_ATAS[k]}</text>
          <text x="${cx(+k) + CELL / 2}" y="${PAD_Y - 15}" text-anchor="middle" font-size="9.5"
          fill="currentColor" opacity=".55" font-family="Inter">TL BAY</text>`;
      });
      Object.keys(BAY_BAWAH).forEach((k) => {
        label += `<text x="${cx(+k) + CELL / 2}" y="${cy(DENAH_BARIS - 1) + CELL + 26}" text-anchor="middle"
          font-size="13" font-weight="800" fill="currentColor" font-family="Manrope">${BAY_BAWAH[k]}</text>`;
      });

      // nomor baris & kolom sebagai panduan orientasi
      let panduan = '';
      for (let b = 0; b < DENAH_BARIS; b++)
        panduan += `<text x="${PAD_X - 22}" y="${cy(b) + CELL / 2 + 4}" text-anchor="middle" font-size="11"
          fill="currentColor" opacity=".38" font-family="Inter">${b + 1}</text>`;
      for (let k = 0; k < DENAH_KOLOM; k++)
        panduan += `<text x="${cx(k) + CELL / 2}" y="${H - PAD_Y + 44}" text-anchor="middle" font-size="11"
          fill="currentColor" opacity=".38" font-family="Inter">${k + 1}</text>`;

      // Rangka denah asli: busbar & penghantar bay dari dokumen, digambar di
      // belakang kotak jaring supaya posisinya terbaca sebagai denah gardu,
      // bukan sekadar kisi kotak.
      const rangka = `
        <g stroke="currentColor" stroke-opacity=".38" stroke-width="2.4" stroke-linecap="round">
          ${DENAH_GARIS.map((g) => `<line x1="${g[0]}" y1="${g[1]}" x2="${g[2]}" y2="${g[3]}"/>`).join('')}
        </g>
        <g fill="currentColor" fill-opacity=".30">
          ${DENAH_TIANG.map((t) => `<rect x="${t[0] - 5}" y="${t[1] - 5}" width="10" height="10" rx="2"/>`).join('')}
        </g>`;

      const rusak = denahRusak(jaring);
      const peringatan = rusak ? `
        <div class="bg-error-container border border-error/40 text-on-error-container rounded-lg px-4 py-3.5">
          <div class="flex items-start gap-2.5">
            <span class="material-symbols-outlined text-base">warning</span>
            <div class="flex-grow">
              <p class="font-bold text-xs uppercase tracking-wide mb-1">Data denah tidak lengkap</p>
              <p class="text-xs leading-relaxed">
                ${rusak.tanpaUkuran ? `${rusak.tanpaUkuran} jaring kehilangan ukuran. ` : ''}${rusak.tumpuk ? `${rusak.tumpuk} jaring menumpuk di posisi yang sama. ` : ''}
                Penyebabnya skema <span class="font-mono">jaring_master</span> di Code.gs masih versi lama,
                sehingga kolom posisi dan ukuran terbuang saat disimpan.
              </p>
              <p class="text-xs mt-2">
                Perbarui Code.gs dengan skema baru, <b>deploy versi baru</b>, lalu klik tombol di bawah.
              </p>
              <button id="btn-perbaiki" class="mt-2.5 bg-error text-on-error rounded-lg px-4 py-2 text-xs font-bold">
                Susun ulang denah
              </button>
            </div>
          </div>
        </div>` : '';

      const r = ringkasJaring(jaring);
      const legenda = KONDISI_JARING.map((k) => `
        <button data-kondisi="${k.key}" class="flex items-center gap-2 px-3 py-1.5 rounded-lg text-xs font-medium transition-colors
          ${statusAktif === k.key ? 'bg-surface-container-high' : 'hover:bg-surface-container-low'}">
          <span class="w-3.5 h-3.5 rounded" style="background:${k.warna}"></span>
          <span>${k.label}</span>
          <span class="opacity-60 tabular-nums">${r.perKondisi[k.key] || 0}</span>
        </button>`).join('');

      return `
        <div class="space-y-4">
          ${peringatan}
          <div class="flex flex-wrap items-center gap-2 justify-between">
            <div class="flex flex-wrap gap-1">${legenda}</div>
            <div class="flex items-center gap-3 text-xs text-on-surface-variant">
              <span class="flex items-center gap-1.5"><span class="w-3.5 h-3.5 rounded-full bg-[#7f1d1d]"></span>Jumlah temuan kerusakan</span>
              <span class="flex items-center gap-1.5"><span class="w-3.5 h-3.5 rounded-full bg-[#78350f]"></span>Usia ≥ 10 tahun</span>
            </div>
          </div>

          ${jaring.length === 0 ? `
            <div class="flex flex-col items-center justify-center py-20 text-center border border-dashed border-outline-variant/50 rounded-xl">
              <span class="material-symbols-outlined text-5xl text-outline-variant">grid_on</span>
              <p class="text-sm text-on-surface-variant mt-3">Menyiapkan denah 42 jaring…</p>
            </div>` : `
            <div class="bg-surface-container-lowest border border-outline-variant/20 rounded-xl p-4 overflow-x-auto text-on-surface">
              <svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:900px;height:auto" xmlns="http://www.w3.org/2000/svg">
                <rect x="${PAD_X - 40}" y="${PAD_Y - 8}" width="${W - PAD_X * 2 + 80}" height="${H - PAD_Y * 2 + 16}"
                      rx="10" fill="none" stroke="currentColor" stroke-opacity=".10" stroke-dasharray="6 5"/>
                ${rangka}${panduan}${label}${kotak}
              </svg>
            </div>
            <div class="grid grid-cols-4 gap-3">
              <div class="bg-surface-container-lowest border border-outline-variant/20 rounded-lg p-3">
                <span class="block font-headline font-extrabold text-xl">${r.total}</span>
                <span class="text-[10px] text-on-surface-variant uppercase tracking-wide">Total jaring</span></div>
              <div class="bg-surface-container-lowest border border-outline-variant/20 rounded-lg p-3">
                <span class="block font-headline font-extrabold text-xl text-error">${(r.perKondisi.ringan || 0) + (r.perKondisi.parah || 0)}</span>
                <span class="text-[10px] text-on-surface-variant uppercase tracking-wide">Ada kerusakan</span></div>
              <div class="bg-surface-container-lowest border border-outline-variant/20 rounded-lg p-3">
                <span class="block font-headline font-extrabold text-xl text-tertiary">${r.perluRemaja}</span>

        e.preventDefault();
        const b = e.target.querySelector('[type=submit]');
        b.disabled = true; b.textContent = 'Menyimpan…';
        try {
          await updateJaring(id, Object.fromEntries(new FormData(e.target).entries()));
          closeModal(); await muat(); toast('Data jaring diperbarui');
        } catch (err) { b.disabled = false; b.textContent = 'Simpan'; alert('Gagal: ' + err.message); }
      });
    }

    function konfirmasiHapus(_tipe, id) {
      $('modal-root').innerHTML = `
        <div class="modal-backdrop">
          <div class="bg-surface-container-lowest text-on-surface rounded-xl shadow-2xl w-[400px] p-6">
            <h2 class="font-headline font-bold text-lg mb-2">Hapus data?</h2>
            <p class="text-sm font-mono mb-2">${esc(id)}</p>
            <p class="text-xs text-on-surface-variant mb-4">Baris di daftar induk dihapus. Riwayat pemeriksaan tetap tersimpan di sheet log.</p>
            <div class="flex gap-2">
              <button id="batal" class="flex-1 border border-outline-variant/40 rounded-lg py-2 text-sm font-medium">Batal</button>
              <button id="ya" class="flex-1 bg-error text-on-error rounded-lg py-2 text-sm font-bold">Hapus</button>
            </div>
          </div>
        </div>`;
      $('batal').addEventListener('click', closeModal);
      $('ya').addEventListener('click', async (e) => {
        e.target.disabled = true; e.target.textContent = 'Menghapus…';
        try {
          await deletePeralatan(id);
          closeModal(); await muat(); toast('Data dihapus');
        } catch (err) { closeModal(); showError('Gagal menghapus: ' + err.message); }
      });
    }

    // ---------- impor ----------
    function panelImpor() {
      $('modal-root').innerHTML = `
        <div class="modal-backdrop">
          <div class="bg-surface-container-lowest text-on-surface rounded-xl shadow-2xl w-[640px] max-h-[88vh] overflow-y-auto p-6">
            <h2 class="font-headline font-bold text-lg mb-1">Impor dari spreadsheet</h2>
            <p class="text-xs text-on-surface-variant mb-3">Salin baris dari Excel/Google Sheets lalu tempel. Urutan kolom:</p>
            <div class="bg-surface-container-low border border-outline-variant/30 rounded-lg p-2.5 mb-3 text-[11px] font-mono text-on-surface-variant overflow-x-auto whitespace-nowrap">
              ID · Jenis · Bay · Merk · Tipe · No. seri · Kapasitas · Tahun · Status
            </div>
            <textarea id="tempel" rows="9" placeholder="TRF-01&#9;Transformator Daya&#9;Bay Trafo 1&#9;Unindo&#9;TTUL&#9;12345&#9;60 MVA&#9;1998&#9;normal" class="w-full bg-surface-container-low border border-outline-variant/40 rounded-lg px-3 py-2 text-xs font-mono text-on-surface"></textarea>
            <div id="pratinjau" class="mt-3 text-xs"></div>
            <div class="mt-3 p-3 bg-surface-container-low rounded-lg space-y-2">
              <label class="flex items-start gap-2 text-xs cursor-pointer"><input type="radio" name="mode" value="tambah" checked class="mt-0.5">
                <span><b>Tambahkan</b> — data lama dipertahankan, ID yang sudah ada dilewati</span></label>
              <label class="flex items-start gap-2 text-xs cursor-pointer"><input type="radio" name="mode" value="ganti" class="mt-0.5">
                <span><b>Ganti seluruhnya</b> — <span class="text-error">seluruh daftar switchgear ditimpa</span></span></label>
            </div>
            <div class="flex gap-2 mt-4">
              <button id="batal" class="flex-1 border border-outline-variant/40 rounded-lg py-2 text-sm font-medium">Batal</button>
              <button id="ya" class="flex-1 bg-primary text-on-primary rounded-lg py-2 text-sm font-bold" disabled>Impor</button>
            </div>
          </div>
        </div>`;
      $('batal').addEventListener('click', closeModal);
      let hasilParse = [];
      $('tempel').addEventListener('input', (e) => {
        const { hasil, ditolak } = parseTempelan(e.target.value);
        hasilParse = hasil;
        $('ya').disabled = !hasil.length;
        if (!e.target.value.trim()) { $('pratinjau').innerHTML = ''; return; }
        $('pratinjau').innerHTML = `<p class="font-bold mb-1">${hasil.length} baris terbaca${ditolak.length ? `, ${ditolak.length} dilewati` : ''}</p>
          ${hasil.slice(0, 4).map((h) => `<div class="text-[11px] text-on-surface-variant font-mono">${esc(h.id_peralatan)} · ${esc(h.jenis)} · ${esc(h.merk)}</div>`).join('')}
          ${hasil.length > 4 ? `<div class="text-[11px] text-outline">…dan ${hasil.length - 4} lainnya</div>` : ''}`;
      });
      $('ya').addEventListener('click', async (e) => {
        e.target.disabled = true; e.target.textContent = 'Mengimpor…';
        const mode = document.querySelector('input[name=mode]:checked').value;
        try {
          const n = await imporPeralatan(hasilParse, mode);
          closeModal(); await muat();
          toast(mode === 'ganti' ? `${n} peralatan diimpor (data lama diganti)` : `${n} peralatan baru ditambahkan`, 4000);
        } catch (err) { closeModal(); showError('Gagal impor: ' + err.message); }
      });
    }

    // ---------- bootstrap ----------
    let sedangSeed = false;

    async function muat() {
      try {
        const [sg, jr, logs, kr] = await Promise.all([
          loadPeralatan(), loadJaring(), loadKondisiLog(), loadKerusakanLog()
        ]);
        switchgear = sg; jaring = jr;
        kondisiMap = groupKondisi(logs); kerusakanMap = groupKerusakan(kr);
        hideError();

        // Denah punya jumlah jaring tetap (42) dan tidak ditambah manual, jadi
        // saat sheet masih kosong isinya langsung disiapkan — semuanya kondisi
        // 'normal', lalu disesuaikan lewat pencatatan pemeriksaan di web.
        if (!jaring.length && !sedangSeed) {
          sedangSeed = true;
          try {
            const res = await seedJaring('normal');
            if (!res.skemaOk) {
              showError('Denah terkirim (' + res.written + ' baris), TAPI kolom denah hilang karena skema jaring_master di Code.gs masih versi lama. Perbarui Code.gs lalu muat ulang.');
            } else {
              jaring = await loadJaring();
              toast(res.count + ' jaring disiapkan dengan kondisi normal', 3800);
            }
          } catch (e) {
            showError('Gagal menyiapkan denah: ' + e.message);
          } finally { sedangSeed = false; }
        }
      } catch (err) {
        switchgear = []; jaring = []; kondisiMap = {}; kerusakanMap = {};
        showError(err.message);
      }
      renderSemua();
    }

    async function bootstrap() {
      const c = $('page-content');
      c.className = 'flex-grow flex flex-col overflow-hidden';
      c.innerHTML = '';
      c.appendChild($('dp-template').content.cloneNode(true));

      $('btn-tambah').addEventListener('click', () => formSwitchgear(null));
      $('btn-impor').addEventListener('click', panelImpor);
      $('btn-muat').addEventListener('click', muat);
      $('cari').addEventListener('input', renderIsi);
      $('cari-kategori').addEventListener('input', renderKategori);
      $('v-grid').addEventListener('click', () => { tampilan = 'grid'; localStorage.setItem('pln_gi_dp_view', 'grid'); renderSemua(); });
      $('v-tabel').addEventListener('click', () => { tampilan = 'tabel'; localStorage.setItem('pln_gi_dp_view', 'tabel'); renderSemua(); });
      document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

      await muat();
    }

    if (requireAuth('../../')) {
      renderShell({ activeId: 'data-peralatan', pageTitle: 'Data Peralatan', rootPrefix: '../../', searchPlaceholder: 'Cari aset...' });
      bootstrap();
    }
  </script>
</body>
</html>
