<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PLN GI Suite — Counter Peralatan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="../../shared/tailwind-config.js"></script>
<style>
  .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; vertical-align: middle; }
  body { font-family: 'Inter', sans-serif; }
  h1, h2, h3 { font-family: 'Manrope', sans-serif; }
  .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; z-index: 2000; padding: 16px; }
</style>
</head>
<body class="bg-background text-on-surface h-screen flex overflow-hidden">

  <div id="app-shell" class="flex w-full"></div>

  <template id="ct-template">
    <div class="p-8 space-y-6 max-w-[1500px] mx-auto w-full">

      <div id="error-banner" class="hidden bg-error-container border border-error/30 text-on-error-container rounded-lg px-4 py-3 flex items-start gap-2">
        <span class="material-symbols-outlined text-base">error</span>
        <div><p class="font-bold text-xs uppercase tracking-wide mb-0.5">Terjadi kesalahan</p><p id="error-message" class="text-xs"></p></div>
      </div>

      <div class="flex items-center justify-between flex-wrap gap-3">
        <div class="inline-flex bg-surface-container-low rounded-lg p-1 gap-1">
          <button id="tab-monitor" class="px-4 py-2 rounded-md text-xs font-bold flex items-center gap-1.5">
            <span class="material-symbols-outlined text-sm">grid_view</span> Monitoring
          </button>
          <button id="tab-isi" class="px-4 py-2 rounded-md text-xs font-bold flex items-center gap-1.5">
            <span class="material-symbols-outlined text-sm">edit_note</span> Isi Counter
          </button>
        </div>
        <div id="monitor-filter" class="flex gap-3 items-center">
          <div class="relative flex-grow max-w-sm">
            <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-sm">search</span>
            <input id="cari" placeholder="Cari bay…" class="w-full bg-surface-container-lowest border border-outline-variant/30 rounded py-2 pl-10 pr-4 text-sm">
          </div>
          <select id="filter-jenis" class="text-sm border border-outline-variant/40 rounded py-2 px-3 bg-surface-container-lowest">
            <option value="">Semua jenis bay</option>
            <option value="trafo">Bay Trafo</option>
            <option value="penghantar">Bay Penghantar</option>
            <option value="kopel">Bay Kopel</option>
          </select>
        </div>
      </div>

      <!-- ---------- Mode Monitoring ---------- -->
      <div id="view-monitor">
        <div id="grid-bay" class="grid grid-cols-3 gap-5"></div>
      </div>

      <!-- ---------- Mode Isi Counter ---------- -->
      <div id="view-isi" class="hidden space-y-5">
        <div class="bg-surface-container-lowest rounded-lg shadow-sm border border-outline-variant/10 p-5 max-w-xl">
          <label class="block text-[11px] font-bold text-on-surface-variant uppercase mb-1.5">Pilih bay</label>
          <select id="sel-bay" class="w-full bg-surface-container-low border border-outline-variant/40 rounded px-3 py-2 text-sm text-on-surface">
            <option value="">— pilih bay —</option>
          </select>
        </div>
        <form id="form-isi" class="hidden bg-surface-container-lowest rounded-lg shadow-sm border border-outline-variant/10 p-5 max-w-xl space-y-4">
          <div>
            <h3 id="isi-judul" class="font-headline font-bold text-base"></h3>
            <p class="text-[11px] text-on-surface-variant mt-0.5">Isi slot yang ada pembacaan hari ini saja — kosongkan yang tidak diukur.</p>
          </div>
          <div id="isi-slot-list" class="grid grid-cols-2 gap-3"></div>
          <div class="grid grid-cols-2 gap-3 pt-2 border-t border-outline-variant/10">
            <div>
              <label class="block text-[11px] font-bold text-on-surface-variant uppercase mb-1">Tanggal baca</label>
              <input name="tanggal" type="date" class="w-full bg-surface-container-low border border-outline-variant/40 rounded px-3 py-2 text-sm text-on-surface">
            </div>
            <div>
              <label class="block text-[11px] font-bold text-on-surface-variant uppercase mb-1">Dibaca oleh</label>
              <input name="oleh" value="Wisnu" class="w-full bg-surface-container-low border border-outline-variant/40 rounded px-3 py-2 text-sm text-on-surface">
            </div>
          </div>
          <button type="submit" class="w-full bg-primary text-on-primary rounded-lg py-2.5 text-sm font-bold">Simpan pembacaan</button>
        </form>
      </div>

      <div id="toast" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 bg-primary text-on-primary text-sm px-4 py-2.5 rounded-lg shadow-lg z-[1500]"></div>
    </div>
  </template>

  <div id="modal-root"></div>

  <script src="../../shared/store.js"></script>
  <script src="../../shared/format.js"></script>
  <script src="../../shared/api.js"></script>
  <script src="../../shared/shell.js"></script>
  <script src="./db.js"></script>
  <script>
    let logs = [], ringkasan = {}, mode = 'monitor';

    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    function toast(m, ms = 2800) { const e = $('toast'); e.textContent = m; e.classList.remove('hidden'); setTimeout(() => e.classList.add('hidden'), ms); }
    function showError(m) { $('error-message').textContent = m; $('error-banner').classList.remove('hidden'); }
    function hideError() { $('error-banner').classList.add('hidden'); }
    function closeModal() { $('modal-root').innerHTML = ''; }

    function setTab(m) {
      mode = m;
      const aktif = 'bg-surface-container-lowest shadow-sm text-primary';
      const nonaktif = 'text-on-surface-variant';
      $('tab-monitor').className = 'px-4 py-2 rounded-md text-xs font-bold flex items-center gap-1.5 ' + (m === 'monitor' ? aktif : nonaktif);
      $('tab-isi').className = 'px-4 py-2 rounded-md text-xs font-bold flex items-center gap-1.5 ' + (m === 'isi' ? aktif : nonaktif);
      $('view-monitor').classList.toggle('hidden', m !== 'monitor');
      $('view-isi').classList.toggle('hidden', m !== 'isi');
      $('monitor-filter').classList.toggle('hidden', m !== 'monitor');
    }

    // ---------- Monitoring: grid kartu per bay ----------
    function sparkline(data) {
      if (data.length < 2) return '';
      const pts = titikSparkline(data, 64, 20);
      return `<svg width="64" height="20" viewBox="0 0 64 20" class="text-primary overflow-visible">
        <polyline points="${pts}" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
      </svg>`;
    }

    /** Satu kotak slot tunggal (PMT di trafo/kopel, OLTC). */
    function kotakSlotTunggal(idBay, slot) {
      const r = ringkasan[idBay + '|' + slot.key];
      return `
        <div class="bg-surface-container-low/40 rounded p-3 cursor-pointer hover:bg-surface-container-low/70" data-slot="${esc(idBay)}|${esc(slot.key)}">
          <p class="text-[10px] font-bold text-on-surface-variant uppercase tracking-wide">${esc(slot.kelompok)}</p>
          ${r ? `
            <div class="flex items-baseline gap-1 mt-0.5">
              <span class="text-2xl font-headline font-extrabold tabular-nums">${formatNumber(r.nilai)}</span>
              <span class="text-[10px] text-on-surface-variant">kali</span>
            </div>
            <p class="text-[10px] text-on-surface-variant mt-1">diisi ${esc(timeAgo(r.terakhir))}${r.mundur ? ' · <span class="text-error font-bold">cek input</span>' : ''}</p>
          ` : `<span class="text-sm text-outline italic">belum ada pembacaan</span>`}
        </div>`;
    }

    /** Grid 3 kolom R/S/T untuk satu kelompok (LA atau PMT-fasa). */
    function kotakSlotFasa(idBay, kelompok, slotFasa) {
      const cells = slotFasa.map((slot) => {
        const r = ringkasan[idBay + '|' + slot.key];
        return `
          <div class="bg-surface-container-low/40 rounded p-2 text-center cursor-pointer hover:bg-surface-container-low/70" data-slot="${esc(idBay)}|${esc(slot.key)}">
            <p class="text-[9px] text-on-surface-variant">${esc(slot.fasa)}</p>
            ${r ? `<span class="text-sm font-bold tabular-nums${r.mundur ? ' text-error' : ''}">${formatNumber(r.nilai)}</span>`
                : `<span class="text-xs text-outline italic">–</span>`}
          </div>`;
      }).join('');
      return `
        <div>
          <p class="text-[10px] font-bold text-on-surface-variant uppercase tracking-wide mb-1.5">${esc(kelompok)}</p>
          <div class="grid grid-cols-3 gap-2">${cells}</div>
        </div>`;
    }

    function kartuBay(bay) {
      const slots = slotUntukBay(bay.jenis);
      const semuaKosong = slots.every((s) => !ringkasan[bay.id + '|' + s.key]);
      const badge = semuaKosong
        ? `<span class="text-[10px] font-bold text-outline bg-surface-container-high px-2 py-0.5 rounded">belum diisi</span>` : '';

      let isi;
      if (bay.jenis === 'trafo') {
        const pmt = slots.find((s) => s.kelompok === 'PMT');
        const la = slots.filter((s) => s.kelompok === 'LA');
        const oltc = slots.find((s) => s.kelompok === 'OLTC');
        isi = kotakSlotTunggal(bay.id, pmt) + kotakSlotFasa(bay.id, 'LA', la) + kotakSlotTunggal(bay.id, oltc);
      } else if (bay.jenis === 'kopel') {
        const pmt = slots.find((s) => s.kelompok === 'PMT');
        const la = slots.filter((s) => s.kelompok === 'LA');
        isi = kotakSlotTunggal(bay.id, pmt) + kotakSlotFasa(bay.id, 'LA', la);
      } else {
        const pmt = slots.filter((s) => s.kelompok === 'PMT');
        const la = slots.filter((s) => s.kelompok === 'LA');
        isi = kotakSlotFasa(bay.id, 'PMT', pmt) + kotakSlotFasa(bay.id, 'LA', la);
      }

      return `
        <div class="bg-surface-container-lowest rounded-lg shadow-sm border border-outline-variant/10 overflow-hidden" data-bay-card="${esc(bay.id)}">
          <div class="px-4 py-3 bg-surface-container-low/50 border-b border-outline-variant/10 flex items-center justify-between">
            <div>
              <h3 class="text-sm font-bold font-mono">${esc(bay.label.toUpperCase())}</h3>
              <p class="text-[10px] text-on-surface-variant uppercase tracking-wide">${esc(JENIS_BAY[bay.jenis].label)}</p>
            </div>
            ${badge}
          </div>
          <div class="p-4 space-y-3">${isi}</div>
        </div>`;
    }

    function renderGrid() {
      const q = $('cari').value.trim().toLowerCase();
      const fj = $('filter-jenis').value;
      const data = BAY_LIST.filter((b) => {
        if (fj && b.jenis !== fj) return false;
        if (q && !b.label.toLowerCase().includes(q)) return false;
        return true;
      });
      const grid = $('grid-bay');
      if (!data.length) {
        grid.innerHTML = `<div class="col-span-3 text-center py-16 text-sm text-on-surface-variant">Tidak ada bay yang cocok dengan filter.</div>`;
        return;
      }
      grid.innerHTML = data.map(kartuBay).join('');
      grid.querySelectorAll('[data-slot]').forEach((el) =>
        el.addEventListener('click', () => {
          const [idBay, slotKey] = el.dataset.slot.split('|');
          detailSlot(idBay, slotKey);
        }));
    }

    // ---------- Detail satu slot (riwayat + trendline) ----------
    function detailSlot(idBay, slotKey) {
      const bay = bayById(idBay);
      const slot = slotBay(idBay).find((s) => s.key === slotKey);
      const r = ringkasan[idBay + '|' + slotKey];
      if (!bay || !slot) return;

      const rows = (r ? r.data.slice().reverse() : []).map((d, i, arr) => {
        const sb = arr[i + 1];
        const dl = sb ? d.nilai - sb.nilai : null;
        return `<tr class="border-b border-outline-variant/15">
          <td class="px-3 py-2 text-xs">${formatDate(d.timestamp)}</td>
          <td class="px-3 py-2 text-xs text-right font-bold tabular-nums">${formatNumber(d.nilai)}</td>
          <td class="px-3 py-2 text-xs text-right tabular-nums ${dl !== null && dl < 0 ? 'text-error' : 'text-on-surface-variant'}">${dl === null ? '–' : (dl > 0 ? '+' : '') + formatNumber(dl)}</td>
          <td class="px-3 py-2 text-[11px] text-on-surface-variant">${esc(d.oleh)}</td>
          <td class="px-3 py-2 text-right">
            <button data-hapus="${esc(d.timestamp)}" class="p-1 text-on-surface-variant hover:text-error" title="Hapus pembacaan">
              <span class="material-symbols-outlined text-sm">delete</span></button>
          </td></tr>`;
      }).join('');

      $('modal-root').innerHTML = `
        <div class="modal-backdrop">
          <div class="bg-surface-container-lowest text-on-surface rounded-xl shadow-2xl w-[600px] max-h-[88vh] flex flex-col overflow-hidden">
            <div class="p-5 border-b border-outline-variant/20">
              <h2 class="font-headline font-bold text-lg font-mono">${esc(bay.label)}</h2>
              <p class="text-xs text-on-surface-variant mt-0.5">${esc(labelSlot(slot))}</p>
              <div class="flex items-baseline gap-2 mt-2">
                <span class="font-headline font-extrabold text-3xl tabular-nums">${r ? formatNumber(r.nilai) : '–'}</span>
                <span class="text-sm text-on-surface-variant">kali</span>
              </div>
              ${r && r.mundur ? `<p class="text-xs text-error mt-2 bg-error-container/40 border border-error/30 rounded p-2">
                Pembacaan terakhir lebih kecil dari sebelumnya. Counter mekanis normalnya hanya bertambah —
                periksa apakah ada salah input, atau peralatan memang diganti/di-reset.</p>` : ''}
              ${r && r.data.length > 1 ? `<div class="mt-2">${sparkline(r.data)}</div>` : ''}
            </div>
            <div class="overflow-y-auto flex-grow">
              <table class="w-full text-left">
                <thead class="bg-surface-container-low/60 sticky top-0">
                  <tr>
                    <th class="px-3 py-2 text-[10px] font-bold text-on-surface-variant uppercase">Tanggal</th>
                    <th class="px-3 py-2 text-[10px] font-bold text-on-surface-variant uppercase text-right">Nilai</th>
                    <th class="px-3 py-2 text-[10px] font-bold text-on-surface-variant uppercase text-right">Selisih</th>
                    <th class="px-3 py-2 text-[10px] font-bold text-on-surface-variant uppercase">Oleh</th>
                    <th></th>
                  </tr>
                </thead>
                <tbody>${rows || `<tr><td colspan="5" class="px-3 py-8 text-center text-sm text-on-surface-variant">Belum ada pembacaan.</td></tr>`}</tbody>
              </table>
            </div>
            <div class="p-4 border-t border-outline-variant/20 flex gap-2 shrink-0">
              <button id="tutup" class="flex-grow border border-outline-variant/40 rounded-lg py-2 text-xs font-bold">Tutup</button>
              <button id="tambah-baca" class="px-4 py-2 bg-primary text-on-primary rounded-lg text-xs font-bold">Isi counter bay ini</button>
            </div>
          </div>
        </div>`;
      $('tutup').addEventListener('click', closeModal);
      $('tambah-baca').addEventListener('click', () => { closeModal(); setTab('isi'); $('sel-bay').value = idBay; $('sel-bay').dispatchEvent(new Event('change')); });
      document.querySelectorAll('[data-hapus]').forEach((b) =>
        b.addEventListener('click', async (e) => {
          e.stopPropagation();
          b.disabled = true;
          try { await hapusPembacaan(b.dataset.hapus, idBay, slotKey); closeModal(); await muat(); toast('Pembacaan dihapus'); }
          catch (err) { showError('Gagal menghapus: ' + err.message); }
        }));
    }

    // ---------- Mode Isi Counter ----------
    function isiOpsiBay() {
      $('sel-bay').innerHTML = '<option value="">— pilih bay —</option>' +
        BAY_LIST.map((b) => `<option value="${esc(b.id)}">${esc(b.label)} — ${esc(JENIS_BAY[b.jenis].label)}</option>`).join('');
    }

    function tampilkanFormIsi(idBay) {
      const bay = bayById(idBay);
      const form = $('form-isi');
      if (!bay) { form.classList.add('hidden'); return; }
      form.classList.remove('hidden');

      const slots = slotUntukBay(bay.jenis);
      $('isi-judul').textContent = `${bay.label} — ${JENIS_BAY[bay.jenis].label}`;
      $('isi-slot-list').innerHTML = slots.map((s) => {
        const r = ringkasan[idBay + '|' + s.key];
        return `
          <div>
            <label class="block text-[11px] font-bold text-on-surface-variant uppercase mb-1">${esc(labelSlot(s))}</label>
            <input name="slot__${esc(s.key)}" type="number" step="any" min="0" inputmode="decimal" placeholder="${r ? formatNumber(r.nilai) : 'belum ada'}"
                   class="w-full bg-surface-container-low border border-outline-variant/40 rounded px-3 py-2 text-sm text-on-surface tabular-nums">
            ${r ? `<p class="text-[10px] text-on-surface-variant mt-0.5">terakhir: ${formatNumber(r.nilai)} · ${esc(timeAgo(r.terakhir))}</p>` : ''}
          </div>`;
      }).join('');

      const kini = new Date();
      const hariIni = `${kini.getFullYear()}-${String(kini.getMonth() + 1).padStart(2, '0')}-${String(kini.getDate()).padStart(2, '0')}`;
      form.querySelector('[name=tanggal]').value = hariIni;
    }

    function bootstrapIsi() {
      isiOpsiBay();
      $('sel-bay').addEventListener('change', (e) => tampilkanFormIsi(e.target.value));

      $('form-isi').addEventListener('submit', async (e) => {
        e.preventDefault();
        const idBay = $('sel-bay').value;
        if (!idBay) return;
        const fd = new FormData(e.target);
        const tanggal = fd.get('tanggal');
        const oleh = fd.get('oleh');
        const nilaiPerSlot = {};
        for (const [k, v] of fd.entries()) {
          if (k.startsWith('slot__') && String(v).trim() !== '') nilaiPerSlot[k.slice(6)] = v;
        }
        if (!Object.keys(nilaiPerSlot).length) { alert('Isi minimal satu slot counter.'); return; }

        // Peringatan kalau ada nilai yang tampak mundur dari pembacaan terakhir.
        const mundurList = Object.entries(nilaiPerSlot)
          .filter(([slot, v]) => {
            const r = ringkasan[idBay + '|' + slot];
            return r && Number(v) < r.nilai;
          });
        if (mundurList.length) {
          const ok = confirm(`${mundurList.length} slot nilainya lebih kecil dari pembacaan terakhir. Counter mekanis normalnya hanya bertambah.\n\nTetap simpan?`);
          if (!ok) return;
        }

        const btn = e.target.querySelector('[type=submit]');
        btn.disabled = true; btn.textContent = 'Menyimpan…';
        try {
          await addPembacaanBanyak(idBay, nilaiPerSlot, tanggal, oleh);
          await muat();
          tampilkanFormIsi(idBay); // refresh angka "terakhir" di form
          toast(`Tersimpan ${Object.keys(nilaiPerSlot).length} pembacaan untuk ${bayById(idBay).label}`);
        } catch (err) {
          alert('Gagal: ' + err.message);
        } finally {
          btn.disabled = false; btn.textContent = 'Simpan pembacaan';
        }
      });
    }

    // ---------- Bootstrap ----------
    async function muat() {
      try {
        logs = await loadCounterLog();
        ringkasan = rangkumCounter(logs);
        hideError();
      } catch (err) {
        logs = []; ringkasan = {};
        showError(err.message);
      }
      renderGrid();
    }

    async function bootstrap() {
      const c = $('page-content');
      c.innerHTML = '';
      c.appendChild($('ct-template').content.cloneNode(true));

      setTab('monitor');
      $('tab-monitor').addEventListener('click', () => setTab('monitor'));
      $('tab-isi').addEventListener('click', () => setTab('isi'));
      $('cari').addEventListener('input', renderGrid);
      $('filter-jenis').addEventListener('change', renderGrid);
      document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

      bootstrapIsi();
      await muat();
    }

    if (requireAuth('../../')) {
      renderShell({ activeId: 'counter', pageTitle: 'Counter Peralatan', rootPrefix: '../../', searchPlaceholder: 'Cari counter...' });
      bootstrap();
    }
  </script>
</body>
</html>
