<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PLN GI Suite — Counter Peralatan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="../../shared/tailwind-config.js"></script>
<style>
  .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; vertical-align: middle; }
  body { font-family: 'Inter', sans-serif; }
  h1, h2, h3 { font-family: 'Manrope', sans-serif; }
  .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; z-index: 2000; padding: 16px; }
</style>
</head>
<body class="bg-background text-on-surface h-screen flex overflow-hidden">

  <div id="app-shell" class="flex w-full"></div>

  <template id="ct-template">
    <div class="p-8 space-y-6 max-w-[1500px] mx-auto w-full">

      <div id="error-banner" class="hidden bg-error-container border border-error/30 text-on-error-container rounded-lg px-4 py-3 flex items-start gap-2">
        <span class="material-symbols-outlined text-base">error</span>
        <div><p class="font-bold text-xs uppercase tracking-wide mb-0.5">Terjadi kesalahan</p><p id="error-message" class="text-xs"></p></div>
      </div>

      <div class="grid grid-cols-4 gap-5">
        <div class="bg-surface-container-lowest p-5 rounded shadow-sm border-l-4 border-primary">
          <span class="text-on-surface-variant text-[10px] font-bold uppercase tracking-wider">Counter dipantau</span>
          <div class="mt-1"><span id="m-seri" class="text-3xl font-headline font-extrabold">–</span></div>
          <p id="m-seri-sub" class="text-[11px] text-on-surface-variant mt-0.5">&nbsp;</p>
        </div>
        <div class="bg-surface-container-lowest p-5 rounded shadow-sm border-l-4 border-error">
          <span class="text-on-surface-variant text-[10px] font-bold uppercase tracking-wider">Lewat ambang</span>
          <div class="mt-1"><span id="m-lewat" class="text-3xl font-headline font-extrabold">–</span></div>
          <p class="text-[11px] text-on-surface-variant mt-0.5">perlu tindak lanjut</p>
        </div>
        <div class="bg-surface-container-lowest p-5 rounded shadow-sm border-l-4 border-tertiary">
          <span class="text-on-surface-variant text-[10px] font-bold uppercase tracking-wider">Mendekati ambang</span>
          <div class="mt-1"><span id="m-dekat" class="text-3xl font-headline font-extrabold">–</span></div>
          <p class="text-[11px] text-on-surface-variant mt-0.5">≥ 80% dari ambang</p>
        </div>
        <div class="bg-surface-container-lowest p-5 rounded shadow-sm border-l-4 border-outline">
          <span class="text-on-surface-variant text-[10px] font-bold uppercase tracking-wider">Perlu dicek</span>
          <div class="mt-1"><span id="m-anomali" class="text-3xl font-headline font-extrabold">–</span></div>
          <p class="text-[11px] text-on-surface-variant mt-0.5">pembacaan turun</p>
        </div>
      </div>

      <div class="bg-surface-container-low border border-outline-variant/25 rounded-lg px-4 py-3 flex items-start gap-2.5">
        <span class="material-symbols-outlined text-base text-tertiary">info</span>
        <p class="text-xs text-on-surface-variant leading-relaxed">
          Ambang tiap jenis counter (mis. 2000 kali kerja PMT) adalah <b>perkiraan awal</b>, bukan ketentuan resmi.
          Sesuaikan dengan instruksi pemeliharaan yang berlaku di unit — angkanya ada di <span class="font-mono">JENIS_COUNTER</span> pada db.js.
        </p>
      </div>

      <section class="bg-surface-container-lowest rounded shadow-sm border border-outline-variant/10 overflow-hidden">
        <div class="p-5 border-b border-outline-variant/10 bg-surface-container-low/30 flex flex-wrap gap-3 items-center justify-between">
          <div class="flex gap-3 items-center flex-grow min-w-0">
            <div class="relative flex-grow max-w-sm">
              <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-sm">search</span>
              <input id="cari" placeholder="Cari ID peralatan…" class="w-full bg-surface-container-low border-none rounded py-2 pl-10 pr-4 text-sm text-on-surface focus:ring-1 focus:ring-primary">
            </div>
            <select id="filter-jenis" class="text-sm border border-outline-variant/40 rounded py-2 px-3 bg-surface-container-lowest text-on-surface">
              <option value="">Semua jenis counter</option>
            </select>
            <select id="filter-status" class="text-sm border border-outline-variant/40 rounded py-2 px-3 bg-surface-container-lowest text-on-surface">
              <option value="">Semua status</option>
              <option value="lewat">Lewat ambang</option>
              <option value="dekat">Mendekati ambang</option>
              <option value="aman">Aman</option>
              <option value="mundur">Pembacaan turun</option>
            </select>
          </div>
          <button id="btn-catat" class="text-xs font-bold bg-primary text-on-primary rounded px-4 py-2 flex items-center gap-1.5 shrink-0">
            <span class="material-symbols-outlined text-sm">add</span> Catat pembacaan
          </button>
        </div>

        <div class="overflow-x-auto min-h-[300px]">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="bg-surface-container-low/50">
                <th class="px-4 py-3 text-[10px] font-bold text-on-surface-variant uppercase tracking-widest border-b border-outline-variant/10">Peralatan</th>
                <th class="px-4 py-3 text-[10px] font-bold text-on-surface-variant uppercase tracking-widest border-b border-outline-variant/10">Jenis counter</th>
                <th class="px-4 py-3 text-[10px] font-bold text-on-surface-variant uppercase tracking-widest border-b border-outline-variant/10 text-right">Nilai terakhir</th>
                <th class="px-4 py-3 text-[10px] font-bold text-on-surface-variant uppercase tracking-widest border-b border-outline-variant/10 text-right">Δ terakhir</th>
                <th class="px-4 py-3 text-[10px] font-bold text-on-surface-variant uppercase tracking-widest border-b border-outline-variant/10">Tren</th>
                <th class="px-4 py-3 text-[10px] font-bold text-on-surface-variant uppercase tracking-widest border-b border-outline-variant/10">Terhadap ambang</th>
                <th class="px-4 py-3 text-[10px] font-bold text-on-surface-variant uppercase tracking-widest border-b border-outline-variant/10">Dibaca</th>
              </tr>
            </thead>
            <tbody id="tbody" class="divide-y divide-outline-variant/10"></tbody>
          </table>
        </div>
        <div id="footer" class="p-4 border-t border-outline-variant/10 text-[10px] text-on-surface-variant font-bold uppercase tracking-tighter bg-surface-container-low/20"></div>
      </section>

      <div id="toast" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 bg-primary text-on-primary text-sm px-4 py-2.5 rounded-lg shadow-lg z-[1500]"></div>
    </div>
  </template>

  <div id="modal-root"></div>

  <script src="../../shared/store.js"></script>
  <script src="../../shared/format.js"></script>
  <script src="../../shared/api.js"></script>
  <script src="../../shared/shell.js"></script>
  <script src="./db.js"></script>
  <script>
    let logs = [], rangkuman = [], peralatan = [];

    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    function toast(m, ms = 2800) { const e = $('toast'); e.textContent = m; e.classList.remove('hidden'); setTimeout(() => e.classList.add('hidden'), ms); }
    function showError(m) { $('error-message').textContent = m; $('error-banner').classList.remove('hidden'); }
    function hideError() { $('error-banner').classList.add('hidden'); }
    function closeModal() { $('modal-root').innerHTML = ''; }

    function badgeAmbang(r) {
      if (r.statusAmbang === null) return '<span class="text-[11px] text-on-surface-variant">tanpa ambang</span>';
      const pct = Math.min(r.pctAmbang, 130);
      const warna = r.statusAmbang === 'lewat' ? 'bg-error' : r.statusAmbang === 'dekat' ? 'bg-tertiary' : 'bg-secondary';
      const sisa = perkiraanBulan(r);
      return `
        <div class="min-w-[130px]">
          <div class="flex items-center justify-between mb-1">
            <span class="text-[11px] font-bold ${r.statusAmbang === 'lewat' ? 'text-error' : r.statusAmbang === 'dekat' ? 'text-tertiary' : 'text-on-surface-variant'}">
              ${Math.round(r.pctAmbang)}%</span>
            <span class="text-[10px] text-on-surface-variant">dari ${formatNumber(r.ambang)}</span>
          </div>
          <div class="h-1.5 w-full bg-surface-container-high rounded overflow-hidden">
            <div class="h-full ${warna}" style="width:${Math.min(pct, 100)}%"></div>
          </div>
          ${sisa !== null && sisa > 0 && sisa < 120
            ? `<p class="text-[10px] text-on-surface-variant mt-1">± ${sisa < 1 ? 'kurang dari 1' : Math.round(sisa)} bulan lagi</p>` : ''}
        </div>`;
    }

    function sparkline(r) {
      if (r.data.length < 2) return '<span class="text-[11px] text-outline">1 pembacaan</span>';
      const pts = titikSparkline(r.data, 84, 26);
      const warna = r.mundur ? '#ba1a1a' : 'currentColor';
      return `<svg width="84" height="26" viewBox="0 0 84 26" class="text-primary overflow-visible">
        <polyline points="${pts}" fill="none" stroke="${warna}" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
        ${r.data.map((d, i) => { const p = pts.split(' ')[i].split(','); return `<circle cx="${p[0]}" cy="${p[1]}" r="1.8" fill="${warna}"/>`; }).join('')}
      </svg>`;
    }

    function isiFilterJenis() {
      const ada = [...new Set(rangkuman.map((r) => r.jenis_counter))];
      $('filter-jenis').innerHTML = '<option value="">Semua jenis counter</option>' +
        ada.map((k) => `<option value="${esc(k)}">${esc(jenisCounter(k).label)}</option>`).join('');
    }

    function renderRingkasan() {
      const s = ringkasCounter(rangkuman);
      $('m-seri').textContent = formatNumber(s.totalSeri);
      $('m-seri-sub').textContent = s.peralatan ? `pada ${s.peralatan} peralatan` : 'belum ada pembacaan';
      $('m-lewat').textContent = formatNumber(s.lewatAmbang);
      $('m-dekat').textContent = formatNumber(s.dekatAmbang);
      $('m-anomali').textContent = formatNumber(s.anomaliInput);
    }

    function renderTabel() {
      const q = $('cari').value.trim().toLowerCase();
      const fj = $('filter-jenis').value;
      const fs = $('filter-status').value;

      const data = rangkuman.filter((r) => {
        if (fj && r.jenis_counter !== fj) return false;
        if (fs === 'mundur' && !r.mundur) return false;
        if (fs && fs !== 'mundur' && r.statusAmbang !== fs) return false;
        if (!q) return true;
        return (r.id_peralatan + ' ' + jenisCounter(r.jenis_counter).label).toLowerCase().includes(q);
      });

      const tb = $('tbody');
      if (!data.length) {
        tb.innerHTML = `<tr><td colspan="7" class="px-6 py-16 text-center">
          <span class="material-symbols-outlined text-4xl text-outline-variant">speed</span>
          <p class="text-sm text-on-surface-variant mt-2">${rangkuman.length ? 'Tidak ada yang cocok dengan filter.' : 'Belum ada pembacaan counter.'}</p>
          ${rangkuman.length ? '' : '<p class="text-xs text-outline mt-1">Mulai dengan tombol "Catat pembacaan".</p>'}
        </td></tr>`;
        $('footer').textContent = '';
        return;
      }

      tb.innerHTML = data.map((r) => {
        const j = jenisCounter(r.jenis_counter);
        const info = peralatan.find((p) => p.id_peralatan === r.id_peralatan);
        return `
        <tr class="hover:bg-surface-container-low/40 cursor-pointer" data-seri="${esc(r.id_peralatan)}|${esc(r.jenis_counter)}">
          <td class="px-4 py-3">
            <div class="text-sm font-bold font-mono">${esc(r.id_peralatan)}</div>
            ${info ? `<div class="text-[11px] text-on-surface-variant">${esc(info.jenis)}${info.bay ? ' · ' + esc(info.bay) : ''}</div>`
                   : '<div class="text-[11px] text-error">tidak ada di daftar peralatan</div>'}
          </td>
          <td class="px-4 py-3 text-xs">${esc(j.label)}</td>
          <td class="px-4 py-3 text-right">
            <span class="text-sm font-bold tabular-nums">${formatNumber(r.nilai)}</span>
            <span class="text-[10px] text-on-surface-variant ml-0.5">${esc(j.satuan)}</span>
          </td>
          <td class="px-4 py-3 text-right">
            ${r.delta === null ? '<span class="text-[11px] text-outline">–</span>'
              : `<span class="text-xs font-bold tabular-nums ${r.mundur ? 'text-error' : 'text-on-surface-variant'}">${r.delta > 0 ? '+' : ''}${formatNumber(r.delta)}</span>
                 ${r.lajuBulan ? `<div class="text-[10px] text-on-surface-variant">${formatNumber(Math.round(r.lajuBulan))}/bln</div>` : ''}`}
          </td>
          <td class="px-4 py-3">${sparkline(r)}</td>
          <td class="px-4 py-3">${badgeAmbang(r)}</td>
          <td class="px-4 py-3">
            <div class="text-xs">${formatDate(r.terakhir)}</div>
            <div class="text-[10px] text-on-surface-variant">${esc(r.oleh) || '–'} · ${r.jumlahBaca}× baca</div>
          </td>
        </tr>`;
      }).join('');

      $('footer').textContent = `Menampilkan ${data.length} dari ${rangkuman.length} counter`;
      tb.querySelectorAll('[data-seri]').forEach((el) =>
        el.addEventListener('click', () => detailSeri(...el.dataset.seri.split('|'))));
    }

    // ---------- Detail satu seri ----------
    function detailSeri(id, jenis) {
      const r = rangkuman.find((x) => x.id_peralatan === id && x.jenis_counter === jenis);
      if (!r) return;
      const j = jenisCounter(jenis);
      const sisa = perkiraanBulan(r);

      const rows = r.data.slice().reverse().map((d, i, arr) => {
        const sb = arr[i + 1];
        const dl = sb ? d.nilai - sb.nilai : null;
        return `<tr class="border-b border-outline-variant/15">
          <td class="px-3 py-2 text-xs">${formatDate(d.timestamp)}</td>
          <td class="px-3 py-2 text-xs text-right font-bold tabular-nums">${formatNumber(d.nilai)}</td>
          <td class="px-3 py-2 text-xs text-right tabular-nums ${dl !== null && dl < 0 ? 'text-error' : 'text-on-surface-variant'}">${dl === null ? '–' : (dl > 0 ? '+' : '') + formatNumber(dl)}</td>
          <td class="px-3 py-2 text-[11px] text-on-surface-variant">${esc(d.oleh)}</td>
          <td class="px-3 py-2 text-right">
            <button data-hapus="${esc(d.timestamp)}" class="p-1 text-on-surface-variant hover:text-error" title="Hapus pembacaan">
              <span class="material-symbols-outlined text-sm">delete</span></button>
          </td></tr>`;
      }).join('');

      $('modal-root').innerHTML = `
        <div class="modal-backdrop">
          <div class="bg-surface-container-lowest text-on-surface rounded-xl shadow-2xl w-[600px] max-h-[88vh] flex flex-col overflow-hidden">
            <div class="p-5 border-b border-outline-variant/20">
              <h2 class="font-headline font-bold text-lg font-mono">${esc(id)}</h2>
              <p class="text-xs text-on-surface-variant mt-0.5">${esc(j.label)}</p>
              <div class="flex items-baseline gap-2 mt-2">
                <span class="font-headline font-extrabold text-3xl tabular-nums">${formatNumber(r.nilai)}</span>
                <span class="text-sm text-on-surface-variant">${esc(j.satuan)}</span>
                ${r.ambang ? `<span class="text-xs ml-2 ${r.statusAmbang === 'lewat' ? 'text-error' : r.statusAmbang === 'dekat' ? 'text-tertiary' : 'text-on-surface-variant'}">
                  ${Math.round(r.pctAmbang)}% dari ambang ${formatNumber(r.ambang)}</span>` : ''}
              </div>
              ${r.mundur ? `<p class="text-xs text-error mt-2 bg-error-container/40 border border-error/30 rounded p-2">
                Pembacaan terakhir lebih kecil dari sebelumnya. Counter mekanis normalnya hanya bertambah —
                periksa apakah ada salah input, atau peralatan memang diganti/di-reset.</p>` : ''}
              ${sisa !== null && sisa > 0 && sisa < 120 ? `<p class="text-xs text-on-surface-variant mt-2">
                Dengan laju ${formatNumber(Math.round(r.lajuBulan))} ${esc(j.satuan)}/bulan, ambang diperkirakan tercapai
                dalam ± ${sisa < 1 ? 'kurang dari 1' : Math.round(sisa)} bulan.</p>` : ''}
            </div>
            <div class="overflow-y-auto flex-grow">
              <table class="w-full text-left">
                <thead class="bg-surface-container-low/60 sticky top-0">
                  <tr>
                    <th class="px-3 py-2 text-[10px] font-bold text-on-surface-variant uppercase">Tanggal</th>
                    <th class="px-3 py-2 text-[10px] font-bold text-on-surface-variant uppercase text-right">Nilai</th>
                    <th class="px-3 py-2 text-[10px] font-bold text-on-surface-variant uppercase text-right">Selisih</th>
                    <th class="px-3 py-2 text-[10px] font-bold text-on-surface-variant uppercase">Oleh</th>
                    <th></th>
                  </tr>
                </thead>
                <tbody>${rows}</tbody>
              </table>
            </div>
            <div class="p-4 border-t border-outline-variant/20 flex gap-2 shrink-0">
              <button id="tutup" class="flex-grow border border-outline-variant/40 rounded-lg py-2 text-xs font-bold">Tutup</button>
              <button id="tambah-baca" class="px-4 py-2 bg-primary text-on-primary rounded-lg text-xs font-bold">Catat pembacaan baru</button>
            </div>
          </div>
        </div>`;
      $('tutup').addEventListener('click', closeModal);
      $('tambah-baca').addEventListener('click', () => formCatat(id, jenis));
      document.querySelectorAll('[data-hapus]').forEach((b) =>
        b.addEventListener('click', async (e) => {
          e.stopPropagation();
          b.disabled = true;
          try { await hapusPembacaan(b.dataset.hapus, id, jenis); closeModal(); await muat(); toast('Pembacaan dihapus'); }
          catch (err) { showError('Gagal menghapus: ' + err.message); }
        }));
    }

    // ---------- Form catat ----------
    function formCatat(idAwal, jenisAwal) {
      const hariIni = new Date().toISOString().slice(0, 10);
      const opsiPeralatan = peralatan.length
        ? peralatan.map((p) => `<option value="${esc(p.id_peralatan)}" ${idAwal === p.id_peralatan ? 'selected' : ''}>${esc(p.id_peralatan)} — ${esc(p.jenis)}</option>`).join('')
        : '';

      $('modal-root').innerHTML = `
        <div class="modal-backdrop">
          <div class="bg-surface-container-lowest text-on-surface rounded-xl shadow-2xl w-[480px] p-6">
            <h2 class="font-headline font-bold text-lg mb-4">Catat pembacaan counter</h2>
            <form id="form-c" class="space-y-3">
              <div>
                <label class="block text-[11px] font-bold text-on-surface-variant uppercase mb-1">Peralatan *</label>
                ${peralatan.length ? `
                  <select name="id_peralatan" required class="w-full bg-surface-container-low border border-outline-variant/40 rounded px-3 py-2 text-sm text-on-surface">
                    ${opsiPeralatan}
                  </select>` : `
                  <input name="id_peralatan" value="${esc(idAwal || '')}" required placeholder="PMT-01"
                         class="w-full bg-surface-container-low border border-outline-variant/40 rounded px-3 py-2 text-sm text-on-surface font-mono">
                  <p class="text-[11px] text-tertiary mt-1">Daftar peralatan masih kosong — ID diketik manual. Isi dulu di menu Data Peralatan agar bisa dipilih.</p>`}
              </div>
              <div>
                <label class="block text-[11px] font-bold text-on-surface-variant uppercase mb-1">Jenis counter *</label>
                <select name="jenis_counter" required id="sel-jenis" class="w-full bg-surface-container-low border border-outline-variant/40 rounded px-3 py-2 text-sm text-on-surface">
                  ${JENIS_COUNTER.map((j) => `<option value="${j.key}" ${jenisAwal === j.key ? 'selected' : ''}>${esc(j.label)}${j.satuan ? ' (' + j.satuan + ')' : ''}</option>`).join('')}
                </select>
              </div>
              <div class="grid grid-cols-2 gap-3">
                <div>
                  <label class="block text-[11px] font-bold text-on-surface-variant uppercase mb-1">Nilai *</label>
                  <input name="nilai" type="number" step="any" min="0" required inputmode="decimal"
                         class="w-full bg-surface-container-low border border-outline-variant/40 rounded px-3 py-2 text-sm text-on-surface tabular-nums">
                </div>
                <div>
                  <label class="block text-[11px] font-bold text-on-surface-variant uppercase mb-1">Tanggal baca</label>
                  <input name="tanggal" type="date" value="${hariIni}"
                         class="w-full bg-surface-container-low border border-outline-variant/40 rounded px-3 py-2 text-sm text-on-surface">
                </div>
              </div>
              <div id="info-sebelum" class="text-[11px] text-on-surface-variant"></div>
              <div>
                <label class="block text-[11px] font-bold text-on-surface-variant uppercase mb-1">Dibaca oleh</label>
                <input name="oleh" value="Wisnu" class="w-full bg-surface-container-low border border-outline-variant/40 rounded px-3 py-2 text-sm text-on-surface">
              </div>
              <div class="flex gap-2 pt-2">
                <button type="button" id="batal" class="flex-1 border border-outline-variant/40 rounded-lg py-2 text-sm font-medium">Batal</button>
                <button type="submit" class="flex-1 bg-primary text-on-primary rounded-lg py-2 text-sm font-bold">Simpan</button>
              </div>
            </form>
          </div>
        </div>`;

      $('batal').addEventListener('click', closeModal);

      // tampilkan nilai terakhir sebagai acuan supaya salah input lebih mudah ketahuan
      const perbaruiInfo = () => {
        const f = $('form-c');
        const id = f.id_peralatan.value, jn = f.jenis_counter.value;
        const r = rangkuman.find((x) => x.id_peralatan === id && x.jenis_counter === jn);
        $('info-sebelum').innerHTML = r
          ? `Pembacaan terakhir: <b class="tabular-nums">${formatNumber(r.nilai)}</b> ${esc(jenisCounter(jn).satuan)} pada ${formatDate(r.terakhir)}.`
          : 'Belum ada pembacaan sebelumnya untuk kombinasi ini.';
      };
      $('form-c').addEventListener('change', perbaruiInfo);
      perbaruiInfo();

      $('form-c').addEventListener('submit', async (e) => {
        e.preventDefault();
        const d = Object.fromEntries(new FormData(e.target).entries());
        const r = rangkuman.find((x) => x.id_peralatan === d.id_peralatan && x.jenis_counter === d.jenis_counter);
        if (r && Number(d.nilai) < r.nilai) {
          const ok = confirm(`Nilai yang dimasukkan (${formatNumber(Number(d.nilai))}) lebih kecil dari pembacaan terakhir (${formatNumber(r.nilai)}).\n\nCounter mekanis normalnya hanya bertambah. Tetap simpan?`);
          if (!ok) return;
        }
        const b = e.target.querySelector('[type=submit]');
        b.disabled = true; b.textContent = 'Menyimpan…';
        try {
          await addPembacaan(d);
          closeModal(); await muat(); toast('Pembacaan tersimpan');
        } catch (err) { b.disabled = false; b.textContent = 'Simpan'; alert('Gagal: ' + err.message); }
      });
    }

    // ---------- Bootstrap ----------
    async function muat() {
      try {
        const [lg, pr] = await Promise.all([loadCounterLog(), apiLoad('peralatan_master')]);
        logs = lg;
        peralatan = pr.filter((p) => p && p.id_peralatan)
          .map((p) => ({ id_peralatan: String(p.id_peralatan), jenis: p.jenis || '', bay: p.bay || '' }))
          .sort((a, b) => a.id_peralatan.localeCompare(b.id_peralatan));
        rangkuman = rangkumCounter(logs);
        hideError();
      } catch (err) {
        logs = []; rangkuman = []; peralatan = [];
        showError(err.message);
      }
      isiFilterJenis();
      renderRingkasan();
      renderTabel();
    }

    async function bootstrap() {
      const c = $('page-content');
      c.innerHTML = '';
      c.appendChild($('ct-template').content.cloneNode(true));

      $('btn-catat').addEventListener('click', () => formCatat(null, null));
      $('cari').addEventListener('input', renderTabel);
      $('filter-jenis').addEventListener('change', renderTabel);
      $('filter-status').addEventListener('change', renderTabel);
      document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

      await muat();
    }

    if (requireAuth('../../')) {
      renderShell({ activeId: 'counter', pageTitle: 'Counter Peralatan', rootPrefix: '../../', searchPlaceholder: 'Cari counter...' });
      bootstrap();
    }
  </script>
</body>
</html>
