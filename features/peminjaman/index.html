<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PLN GI Suite — Peminjaman Peralatan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="../../shared/tailwind-config.js"></script>
<style>
  .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; vertical-align: middle; }
  body { font-family: 'Inter', sans-serif; }
  h1, h2, h3 { font-family: 'Manrope', sans-serif; }
  .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; z-index: 2000; padding: 16px; }
</style>
</head>
<body class="bg-background text-on-surface h-screen flex overflow-hidden">

  <div id="app-shell" class="flex w-full"></div>

  <template id="pj-template">
    <div class="p-8 space-y-6 max-w-[1500px] mx-auto w-full">

      <div id="error-banner" class="hidden bg-error-container border border-error/30 text-on-error-container rounded-lg px-4 py-3 flex items-start gap-2">
        <span class="material-symbols-outlined text-base">error</span>
        <div><p class="font-bold text-xs uppercase tracking-wide mb-0.5">Terjadi kesalahan</p><p id="error-message" class="text-xs"></p></div>
      </div>

      <div class="grid grid-cols-4 gap-5">
        <div class="bg-surface-container-lowest p-5 rounded shadow-sm border-l-4 border-primary">
          <span class="text-on-surface-variant text-[10px] font-bold uppercase tracking-wider">Total alat</span>
          <div class="mt-1"><span id="m-total" class="text-3xl font-headline font-extrabold">–</span></div>
        </div>
        <div class="bg-surface-container-lowest p-5 rounded shadow-sm border-l-4 border-secondary">
          <span class="text-on-surface-variant text-[10px] font-bold uppercase tracking-wider">Tersedia</span>
          <div class="mt-1"><span id="m-tersedia" class="text-3xl font-headline font-extrabold">–</span></div>
        </div>
        <div class="bg-surface-container-lowest p-5 rounded shadow-sm border-l-4 border-tertiary">
          <span class="text-on-surface-variant text-[10px] font-bold uppercase tracking-wider">Sedang dipinjam</span>
          <div class="mt-1"><span id="m-dipinjam" class="text-3xl font-headline font-extrabold">–</span></div>
        </div>
        <div class="bg-surface-container-lowest p-5 rounded shadow-sm border-l-4 border-outline">
          <span class="text-on-surface-variant text-[10px] font-bold uppercase tracking-wider">Perlu perhatian</span>
          <div class="mt-1"><span id="m-perbaikan" class="text-3xl font-headline font-extrabold">–</span></div>
          <p class="text-[11px] text-on-surface-variant mt-0.5">kondisi bukan "baik"</p>
        </div>
      </div>

      <div class="flex items-center justify-between flex-wrap gap-3">
        <div class="inline-flex bg-surface-container-low rounded-lg p-1 gap-1">
          <button id="tab-monitor" class="px-4 py-2 rounded-md text-xs font-bold flex items-center gap-1.5">
            <span class="material-symbols-outlined text-sm">grid_view</span> Monitoring
          </button>
          <button id="tab-pinjam" class="px-4 py-2 rounded-md text-xs font-bold flex items-center gap-1.5">
            <span class="material-symbols-outlined text-sm">assignment_turned_in</span> Pinjam Alat
          </button>
          <button id="tab-kembali" class="px-4 py-2 rounded-md text-xs font-bold flex items-center gap-1.5">
            <span class="material-symbols-outlined text-sm">assignment_return</span> Kembalikan
          </button>
          <button id="tab-kelola" class="px-4 py-2 rounded-md text-xs font-bold flex items-center gap-1.5">
            <span class="material-symbols-outlined text-sm">settings</span> Kelola Data
          </button>
        </div>
        <div id="monitor-filter" class="flex gap-3 items-center">
          <div class="relative flex-grow max-w-sm">
            <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-sm">search</span>
            <input id="cari" placeholder="Cari alat…" class="w-full bg-surface-container-lowest border border-outline-variant/30 rounded py-2 pl-10 pr-4 text-sm">
          </div>
          <select id="filter-status" class="text-sm border border-outline-variant/40 rounded py-2 px-3 bg-surface-container-lowest">
            <option value="">Semua status</option>
            <option value="tersedia">Tersedia</option>
            <option value="dipinjam">Dipinjam</option>
          </select>
        </div>
      </div>

      <!-- ---------- Mode Monitoring ---------- -->
      <div id="view-monitor">
        <div id="grid-alat" class="grid grid-cols-3 gap-5"></div>
      </div>

      <!-- ---------- Mode Pinjam Alat ---------- -->
      <div id="view-pinjam" class="hidden max-w-xl">
        <form id="form-pinjam" class="bg-surface-container-lowest rounded-lg shadow-sm border border-outline-variant/10 p-5 space-y-4">
          <h3 class="font-headline font-bold text-base">Ajukan peminjaman</h3>
          <div>
            <label class="block text-[11px] font-bold text-on-surface-variant uppercase mb-1">Alat *</label>
            <select name="id_alat" required class="w-full bg-surface-container-low border border-outline-variant/40 rounded px-3 py-2 text-sm text-on-surface">
              <option value="">— pilih alat yang tersedia —</option>
            </select>
          </div>
          <div>
            <label class="block text-[11px] font-bold text-on-surface-variant uppercase mb-1">Peminjam *</label>
            <select name="id_personil" required class="w-full bg-surface-container-low border border-outline-variant/40 rounded px-3 py-2 text-sm text-on-surface">
              <option value="">— pilih nama —</option>
            </select>
          </div>
          <div>
            <label class="block text-[11px] font-bold text-on-surface-variant uppercase mb-1">Foto kondisi alat (wajib) *</label>
            <input name="foto" type="file" accept="image/*" capture="environment" required
                   class="w-full text-sm file:mr-3 file:py-2 file:px-3 file:rounded file:border-0 file:bg-primary file:text-on-primary file:text-xs file:font-bold">
            <img id="preview-pinjam" class="hidden mt-2 rounded max-h-40 border border-outline-variant/20">
          </div>
          <div>
            <label class="block text-[11px] font-bold text-on-surface-variant uppercase mb-1">Catatan (opsional)</label>
            <textarea name="catatan" rows="2" class="w-full bg-surface-container-low border border-outline-variant/40 rounded px-3 py-2 text-sm text-on-surface"></textarea>
          </div>
          <button type="submit" class="w-full bg-primary text-on-primary rounded-lg py-2.5 text-sm font-bold">Pinjam sekarang</button>
        </form>
      </div>

      <!-- ---------- Mode Kembalikan ---------- -->
      <div id="view-kembali" class="hidden max-w-xl">
        <form id="form-kembali" class="bg-surface-container-lowest rounded-lg shadow-sm border border-outline-variant/10 p-5 space-y-4">
          <h3 class="font-headline font-bold text-base">Kembalikan Alat</h3>
          <div>
            <label class="block text-[11px] font-bold text-on-surface-variant uppercase mb-1">Alat yang dipinjam *</label>
            <select name="id_pinjam" required class="w-full bg-surface-container-low border border-outline-variant/40 rounded px-3 py-2 text-sm text-on-surface">
              <option value="">— pilih alat yang akan dikembalikan —</option>
            </select>
          </div>
          <div id="info-pinjam" class="hidden bg-surface-container-low rounded-lg p-4 space-y-2 text-sm">
            <p><span class="text-on-surface-variant">Peminjam:</span> <span id="kembali-peminjam" class="font-bold">-</span></p>
            <p><span class="text-on-surface-variant">Dipinjam sejak:</span> <span id="kembali-waktu" class="font-bold">-</span></p>
            <p><span class="text-on-surface-variant">Catatan pinjam:</span> <span id="kembali-catatan">-</span></p>
          </div>
          <div>
            <label class="block text-[11px] font-bold text-on-surface-variant uppercase mb-1">Foto kondisi alat saat dikembalikan (wajib) *</label>
            <input name="foto_kembali" type="file" accept="image/*" capture="environment" required
                   class="w-full text-sm file:mr-3 file:py-2 file:px-3 file:rounded file:border-0 file:bg-primary file:text-on-primary file:text-xs file:font-bold">
            <img id="preview-kembali" class="hidden mt-2 rounded max-h-40 border border-outline-variant/20">
          </div>
          <div>
            <label class="block text-[11px] font-bold text-on-surface-variant uppercase mb-1">Kondisi alat</label>
            <select name="kondisi_kembali" class="w-full bg-surface-container-low border border-outline-variant/40 rounded px-3 py-2 text-sm text-on-surface">
              <option value="baik">Baik</option>
              <option value="rusak_ringan">Rusak Ringan</option>
              <option value="rusak_berat">Rusak Berat</option>
            </select>
          </div>
          <div>
            <label class="block text-[11px] font-bold text-on-surface-variant uppercase mb-1">Catatan pengembalian (opsional)</label>
            <textarea name="catatan_kembali" rows="2" class="w-full bg-surface-container-low border border-outline-variant/40 rounded px-3 py-2 text-sm text-on-surface"></textarea>
          </div>
          <button type="submit" class="w-full bg-primary text-on-primary rounded-lg py-2.5 text-sm font-bold">Kembalikan Alat</button>
        </form>
      </div>

      <!-- ---------- Mode Kelola Data ---------- -->
      <div id="view-kelola" class="hidden grid grid-cols-2 gap-6 items-start">
        <div class="bg-surface-container-lowest rounded-lg shadow-sm border border-outline-variant/10 p-5 space-y-4">
          <h3 class="font-headline font-bold text-base">Tambah alat baru</h3>
          <form id="form-alat" class="space-y-3">
            <input name="nama_alat" required placeholder="Nama alat (mis. Bor tangan Bosch)"
                   class="w-full bg-surface-container-low border border-outline-variant/40 rounded px-3 py-2 text-sm text-on-surface">
            <select name="kategori" class="w-full bg-surface-container-low border border-outline-variant/40 rounded px-3 py-2 text-sm text-on-surface"></select>
            <select name="kondisi" class="w-full bg-surface-container-low border border-outline-variant/40 rounded px-3 py-2 text-sm text-on-surface"></select>
            <textarea name="catatan" rows="2" placeholder="Catatan (opsional)"
                      class="w-full bg-surface-container-low border border-outline-variant/40 rounded px-3 py-2 text-sm text-on-surface"></textarea>
            <div class="flex gap-2">
              <button type="submit" class="flex-1 bg-primary text-on-primary rounded-lg py-2 text-sm font-bold">Simpan alat</button>
              <button type="button" id="btn-batal-alat" class="hidden px-4 bg-surface-container text-on-surface rounded-lg py-2 text-sm font-bold border border-outline-variant/40" onclick="batalEditAlat()">Batal</button>
            </div>
          </form>
          <div id="daftar-alat-kelola" class="pt-2 border-t border-outline-variant/10 space-y-1.5 max-h-64 overflow-y-auto"></div>
        </div>
        <div class="bg-surface-container-lowest rounded-lg shadow-sm border border-outline-variant/10 p-5 space-y-4">
          <h3 class="font-headline font-bold text-base">Tambah personil</h3>
          <form id="form-personil" class="space-y-3">
            <input name="nama" required placeholder="Nama personil"
                   class="w-full bg-surface-container-low border border-outline-variant/40 rounded px-3 py-2 text-sm text-on-surface">
            <input name="jabatan" placeholder="Jabatan (opsional)"
                   class="w-full bg-surface-container-low border border-outline-variant/40 rounded px-3 py-2 text-sm text-on-surface">
            <div class="flex gap-2">
              <button type="submit" class="flex-1 bg-primary text-on-primary rounded-lg py-2 text-sm font-bold">Simpan personil</button>
              <button type="button" id="btn-batal-personil" class="hidden px-4 bg-surface-container text-on-surface rounded-lg py-2 text-sm font-bold border border-outline-variant/40" onclick="batalEditPersonil()">Batal</button>
            </div>
          </form>
          <div id="daftar-personil-kelola" class="pt-2 border-t border-outline-variant/10 space-y-1.5 max-h-64 overflow-y-auto"></div>
        </div>
      </div>

      <div id="toast" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 bg-primary text-on-primary text-sm px-4 py-2.5 rounded-lg shadow-lg z-[1500]"></div>
    </div>
  </template>

  <div id="modal-root"></div>

  <script src="../../shared/store.js"></script>
  <script src="../../shared/format.js"></script>
  <script src="../../shared/api.js"></script>
  <script src="../../shared/shell.js"></script>
  <script src="./db.js"></script>
  <script>
    let alatList = [], personilList = [], peminjamanList = [], alatRangkuman = [], mode = 'monitor';

    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    function toast(m, ms = 3200) { const e = $('toast'); e.textContent = m; e.classList.remove('hidden'); setTimeout(() => e.classList.add('hidden'), ms); }
    function showError(m) { $('error-message').textContent = m; $('error-banner').classList.remove('hidden'); }
    function hideError() { $('error-banner').classList.add('hidden'); }
    function closeModal() { $('modal-root').innerHTML = ''; }

    /** File input -> base64 murni (tanpa prefix data:...;base64,). */
    function fileKeBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result).split(',')[1]);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    async function unggahFotoPeminjaman(file, label) {
      const base64 = await fileKeBase64(file);
      const nama = `${label}-${Date.now()}-${file.name}`;
      const info = await apiUploadFile('Peminjaman', nama, file.type || 'image/jpeg', base64);
      return info.url;
    }

    /** Buat teks notifikasi peminjaman untuk Telegram */
    function teksNotifPinjam(alat, personil) {
      if (!alat || !personil) {
        console.warn('teksNotifPinjam: alat atau personil undefined', { alat, personil });
        return '📦 Alat telah dipinjam';
      }
      
      const waktu = new Date().toLocaleString('id-ID', { dateStyle: 'short', timeStyle: 'short' });
      return `📦 <b>Alat Dipinjam</b>\n\n` +
             `<b>Alat:</b> ${esc(alat.nama_alat || '-')}\n` +
             `<b>Kategori:</b> ${esc(alat.kategori || '-')}\n` +
             `<b>Peminjam:</b> ${esc(personil.nama || '-')}\n` +
             `<b>Jabatan:</b> ${esc(personil.jabatan || '-')}\n` +
             `<b>Waktu:</b> ${waktu}`;
    }

    /** Kirim notif Telegram tanpa memblokir alur utama kalau gagal. */
    async function kirimNotif(teks) {
      try {
        console.log('📤 Kirim notif Telegram:', teks.substring(0, 50) + '...');
        const hasil = await apiNotifyTelegram(teks);
        console.log('📥 Notif response:', hasil);
        
        if (!hasil) {
          console.warn('❌ Response kosong dari backend');
          return;
        }
        
        // hasil bisa berupa: { sent: true/false, results: [...] } atau { sent: false, reason: "..." }
        if (hasil.sent === true) {
          console.log('✅ Notif terkirim ke semua');
        } else if (hasil.sent === false) {
          const reason = hasil.reason || (hasil.results ? 'Lihat results' : 'Unknown error');
          console.warn('⚠️  Notifikasi Telegram gagal:', reason);
          if (hasil.results && Array.isArray(hasil.results)) {
            hasil.results.forEach(r => {
              console.warn(`   - ${r.chatId}: ${r.reason || (r.sent ? 'OK' : 'Failed')}`);
            });
          }
        } else {
          console.warn('⚠️  Notifikasi status tidak jelas:', hasil);
        }
      } catch (err) {
        console.error('❌ Notifikasi Telegram error:', err.message);
      }
    }

    function setTab(m) {
      mode = m;
      const aktif = 'bg-surface-container-lowest shadow-sm text-primary';
      const nonaktif = 'text-on-surface-variant';
      $('tab-monitor').className = 'px-4 py-2 rounded-md text-xs font-bold flex items-center gap-1.5 ' + (m === 'monitor' ? aktif : nonaktif);
      $('tab-pinjam').className = 'px-4 py-2 rounded-md text-xs font-bold flex items-center gap-1.5 ' + (m === 'pinjam' ? aktif : nonaktif);
      $('tab-kembali').className = 'px-4 py-2 rounded-md text-xs font-bold flex items-center gap-1.5 ' + (m === 'kembali' ? aktif : nonaktif);
      $('tab-kelola').className = 'px-4 py-2 rounded-md text-xs font-bold flex items-center gap-1.5 ' + (m === 'kelola' ? aktif : nonaktif);
      $('view-monitor').classList.toggle('hidden', m !== 'monitor');
      $('view-pinjam').classList.toggle('hidden', m !== 'pinjam');
      $('view-kembali').classList.toggle('hidden', m !== 'kembali');
      $('view-kelola').classList.toggle('hidden', m !== 'kelola');
      $('monitor-filter').classList.toggle('hidden', m !== 'monitor');
      if (m === 'kelola') renderKelola();
      if (m === 'pinjam') isiOpsiPinjam();
      if (m === 'kembali') isiOpsiKembali();
    }

    // ---------- Monitoring: grid kartu per alat ----------
    function kartuAlat(a) {
      const dipinjam = a.status === 'dipinjam';
      return `
        <div class="bg-surface-container-lowest rounded-lg shadow-sm border border-outline-variant/10 overflow-hidden cursor-pointer hover:shadow-md transition-shadow" data-alat="${esc(a.id_alat)}">
          <div class="px-4 py-3 bg-surface-container-low/50 border-b border-outline-variant/10 flex items-start justify-between gap-2">
            <div class="min-w-0">
              <h3 class="text-sm font-bold truncate">${esc(a.nama_alat)}</h3>
              <p class="text-[10px] text-on-surface-variant uppercase tracking-wide">${esc(a.kategori)}</p>
            </div>
            <span class="text-[10px] font-bold px-2 py-0.5 rounded shrink-0 ${dipinjam ? 'text-tertiary bg-tertiary/10' : 'text-secondary bg-secondary/10'}">
              ${dipinjam ? 'Dipinjam' : 'Tersedia'}</span>
          </div>
          <div class="p-4 space-y-2">
            <div class="flex items-center justify-between text-xs">
              <span class="text-on-surface-variant">Kondisi</span>
              <span class="font-medium ${a.kondisi !== 'baik' ? 'text-error' : ''}">${esc(labelKondisi(a.kondisi))}</span>
            </div>
            ${dipinjam && a.peminjamAktif ? `
              <div class="flex items-center justify-between text-xs">
                <span class="text-on-surface-variant">Dipinjam oleh</span>
                <span class="font-medium">${esc(a.peminjamAktif.nama)}</span>
              </div>
              <div class="flex items-center justify-between text-xs">
                <span class="text-on-surface-variant">Sejak</span>
                <span class="font-medium">${esc(timeAgo(a.pinjamanAktif.tanggal_pinjam))}</span>
              </div>` : ''}
            <p class="text-[10px] text-on-surface-variant pt-1 border-t border-outline-variant/10">
              ${a.jumlahDipinjam ? `${a.jumlahDipinjam}× dipinjam sepanjang riwayat` : 'Belum pernah dipinjam'}</p>
          </div>
        </div>`;
    }

    function renderGrid() {
      const q = $('cari').value.trim().toLowerCase();
      const fs = $('filter-status').value;
      const data = alatRangkuman.filter((a) => {
        if (fs && a.status !== fs) return false;
        if (q && !(a.nama_alat + ' ' + a.kategori).toLowerCase().includes(q)) return false;
        return true;
      });
      const grid = $('grid-alat');
      if (!data.length) {
        grid.innerHTML = `<div class="col-span-3 text-center py-16 text-sm text-on-surface-variant">
          ${alatRangkuman.length ? 'Tidak ada alat yang cocok dengan filter.' : 'Belum ada alat terdaftar. Tambahkan lewat tab "Kelola Data".'}</div>`;
        return;
      }
      grid.innerHTML = data.map(kartuAlat).join('');
      grid.querySelectorAll('[data-alat]').forEach((el) =>
        el.addEventListener('click', () => detailAlat(el.dataset.alat)));
    }

    // ---------- Detail alat (riwayat + tombol kembalikan) ----------
    function detailAlat(idAlat) {
      const a = alatRangkuman.find((x) => x.id_alat === idAlat);
      if (!a) return;

      const rows = a.riwayat.map((r) => {
        const peminjam = personilList.find((p) => p.id_personil === r.id_personil);
        return `<tr class="border-b border-outline-variant/15">
          <td class="px-3 py-2 text-xs">${esc(peminjam ? peminjam.nama : '—')}</td>
          <td class="px-3 py-2 text-xs">${formatDate(r.tanggal_pinjam)}</td>
          <td class="px-3 py-2 text-xs">${r.tanggal_kembali ? formatDate(r.tanggal_kembali) : '<span class="text-tertiary font-bold">masih dipinjam</span>'}</td>
          <td class="px-3 py-2 text-right">
            ${r.foto_pinjam_url ? `<a href="${esc(r.foto_pinjam_url)}" target="_blank" class="text-primary text-[11px] font-bold">foto pinjam</a>` : ''}
            ${r.foto_kembali_url ? ` · <a href="${esc(r.foto_kembali_url)}" target="_blank" class="text-primary text-[11px] font-bold">foto kembali</a>` : ''}
          </td>
        </tr>`;
      }).join('');

      $('modal-root').innerHTML = `
        <div class="modal-backdrop">
          <div class="bg-surface-container-lowest text-on-surface rounded-xl shadow-2xl w-[600px] max-h-[88vh] flex flex-col overflow-hidden">
            <div class="p-5 border-b border-outline-variant/20">
              <h2 class="font-headline font-bold text-lg">${esc(a.nama_alat)}</h2>
              <p class="text-xs text-on-surface-variant mt-0.5">${esc(a.kategori)} · Kondisi: ${esc(labelKondisi(a.kondisi))}</p>
              ${a.status === 'dipinjam' && a.peminjamAktif ? `
                <div class="mt-3 bg-tertiary/10 border border-tertiary/30 rounded p-3">
                  <p class="text-xs"><b>${esc(a.peminjamAktif.nama)}</b> sedang meminjam alat ini sejak ${formatDate(a.pinjamanAktif.tanggal_pinjam)}.</p>
                  <button id="btn-kembalikan" class="mt-2 text-xs font-bold bg-primary text-on-primary rounded px-3 py-1.5">Proses pengembalian</button>
                </div>` : `<p class="text-xs text-secondary mt-2 font-medium">Alat tersedia untuk dipinjam.</p>`}
            </div>
            <div class="overflow-y-auto flex-grow">
              <table class="w-full text-left">
                <thead class="bg-surface-container-low/60 sticky top-0">
                  <tr>
                    <th class="px-3 py-2 text-[10px] font-bold text-on-surface-variant uppercase">Peminjam</th>
                    <th class="px-3 py-2 text-[10px] font-bold text-on-surface-variant uppercase">Pinjam</th>
                    <th class="px-3 py-2 text-[10px] font-bold text-on-surface-variant uppercase">Kembali</th>

                  </tr>
                </thead>
                <tbody>${rows || `<tr><td colspan="4" class="px-3 py-8 text-center text-sm text-on-surface-variant">Belum ada riwayat peminjaman.</td></tr>`}</tbody>
              </table>
            </div>
            <div class="p-4 border-t border-outline-variant/20 shrink-0">
              <button id="tutup" class="w-full border border-outline-variant/40 rounded-lg py-2 text-xs font-bold">Tutup</button>
            </div>
          </div>
        </div>`;
      $('tutup').addEventListener('click', closeModal);
      const btnKembali = $('btn-kembalikan');
      if (btnKembali) btnKembali.addEventListener('click', () => { closeModal(); formKembalikan(a); });

    // ---------- Form pengembalian (foto wajib) ----------
    function formKembalikan(a) {
      const peminjam = personilList.find((p) => p.id_personil === a.pinjamanAktif.id_personil);
      $('modal-root').innerHTML = `
        <div class="modal-backdrop">
          <div class="bg-surface-container-lowest text-on-surface rounded-xl shadow-2xl w-[480px] p-6">
            <h2 class="font-headline font-bold text-lg mb-1">Kembalikan alat</h2>
            <p class="text-xs text-on-surface-variant mb-4">${esc(a.nama_alat)} — dipinjam oleh ${esc(peminjam ? peminjam.nama : '—')}</p>
            <form id="form-kembali" class="space-y-3">
              <div>
                <label class="block text-[11px] font-bold text-on-surface-variant uppercase mb-1">Foto kondisi saat kembali (wajib) *</label>
                <input name="foto" type="file" accept="image/*" capture="environment" required
                       class="w-full text-sm file:mr-3 file:py-2 file:px-3 file:rounded file:border-0 file:bg-primary file:text-on-primary file:text-xs file:font-bold">
              </div>
              <div>
                <label class="block text-[11px] font-bold text-on-surface-variant uppercase mb-1">Kondisi alat sekarang</label>
                <select name="kondisi_setelah" class="w-full bg-surface-container-low border border-outline-variant/40 rounded px-3 py-2 text-sm text-on-surface">
                  ${KONDISI_ALAT.map((k) => `<option value="${k.key}" ${k.key === a.kondisi ? 'selected' : ''}>${esc(k.label)}</option>`).join('')}
                </select>
              </div>
              <div>
                <label class="block text-[11px] font-bold text-on-surface-variant uppercase mb-1">Catatan (opsional)</label>
                <textarea name="catatan_kembali" rows="2" class="w-full bg-surface-container-low border border-outline-variant/40 rounded px-3 py-2 text-sm text-on-surface"></textarea>
              </div>
              <div class="flex gap-2 pt-2">
                <button type="button" id="batal" class="flex-1 border border-outline-variant/40 rounded-lg py-2 text-sm font-medium">Batal</button>
                <button type="submit" class="flex-1 bg-primary text-on-primary rounded-lg py-2 text-sm font-bold">Simpan pengembalian</button>
              </div>
            </form>
          </div>
        </div>`;
      $('batal').addEventListener('click', closeModal);
      $('form-kembali').addEventListener('submit', async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const file = fd.get('foto');
        if (!file || !file.size) { alert('Foto wajib diunggah.'); return; }

        const btn = e.target.querySelector('[type=submit]');
        btn.disabled = true; btn.textContent = 'Mengunggah foto…';
        try {
          const fotoUrl = await unggahFotoPeminjaman(file, `kembali-${a.id_alat}`);
          btn.textContent = 'Menyimpan…';
          await kembalikanAlat({
            id_pinjam: a.pinjamanAktif.id_pinjam,
            foto_kembali_url: fotoUrl,
            catatan_kembali: fd.get('catatan_kembali'),
            kondisi_setelah: fd.get('kondisi_setelah')
          });
          closeModal();
          await muat();
          toast(`${a.nama_alat} sudah dikembalikan`);
          if (peminjam) await kirimNotif(teksNotifKembali(a, peminjam));
        } catch (err) {
          alert('Gagal: ' + err.message);
          btn.disabled = false; btn.textContent = 'Simpan pengembalian';
        }
      });
    }

    // ---------- Mode Pinjam Alat ----------
    function isiOpsiPinjam() {
      const form = $('form-pinjam');
      const tersedia = alatList.filter((a) => a.status === 'tersedia');
      form.id_alat.innerHTML = '<option value="">— pilih alat yang tersedia —</option>' +
        tersedia.map((a) => `<option value="${esc(a.id_alat)}">${esc(a.nama_alat)} (${esc(a.kategori)})</option>`).join('');
      if (!tersedia.length) {
        form.id_alat.innerHTML = '<option value="">Tidak ada alat tersedia saat ini</option>';
      }
      form.id_personil.innerHTML = '<option value="">— pilih nama —</option>' +
        personilList.map((p) => `<option value="${esc(p.id_personil)}">${esc(p.nama)}${p.jabatan ? ' — ' + esc(p.jabatan) : ''}</option>`).join('');
    }

    function bootstrapPinjam() {
      const form = $('form-pinjam');
      form.foto.addEventListener('change', () => {
        const f = form.foto.files[0];
        const img = $('preview-pinjam');
        if (!f) { img.classList.add('hidden'); return; }
        img.src = URL.createObjectURL(f);
        img.classList.remove('hidden');
      });

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const idAlat = fd.get('id_alat'), idPersonil = fd.get('id_personil');
        const file = fd.get('foto');
        if (!idAlat || !idPersonil) { alert('Pilih alat dan peminjam.'); return; }
        if (!file || !file.size) { alert('Foto wajib diunggah.'); return; }

        const btn = e.target.querySelector('[type=submit]');
        btn.disabled = true; btn.textContent = 'Mengunggah foto…';
        try {
          const fotoUrl = await unggahFotoPeminjaman(file, `pinjam-${idAlat}`);
          btn.textContent = 'Menyimpan…';
          await pinjamAlat({ id_alat: idAlat, id_personil: idPersonil, foto_pinjam_url: fotoUrl, catatan_pinjam: fd.get('catatan') });
          await muat();

          const alat = alatList.find((a) => a.id_alat === idAlat);
          const personil = personilList.find((p) => p.id_personil === idPersonil);
          toast(`${alat.nama_alat} berhasil dipinjam oleh ${personil.nama}`);
          if (alat && personil) await kirimNotif(teksNotifPinjam(alat, personil));

          e.target.reset();
          $('preview-pinjam').classList.add('hidden');
          isiOpsiPinjam();
        } catch (err) {
          alert('Gagal: ' + err.message);
        } finally {
          btn.disabled = false; btn.textContent = 'Pinjam sekarang';
        }
      });
    }

    // ---------- Mode Kembalikan ----------

    async function muatPeminjaman() {
      try {
        const res = await apiLoad('peminjaman_log');
        peminjamanList = (res || []).filter(p => p.status === 'dipinjam');
      } catch (err) {
        console.error('Gagal load peminjaman:', err);
        peminjamanList = [];
      }
    }

    function isiOpsiKembali() {
      const form = $('form-kembali');
      const dipinjam = alatList.filter(a => a.status === 'dipinjam');
      
      if (!dipinjam.length) {
        form.id_pinjam.innerHTML = '<option value="">Tidak ada alat yang sedang dipinjam</option>';
        $('info-pinjam').classList.add('hidden');
        return;
      }
      
      form.id_pinjam.innerHTML = '<option value="">— pilih alat yang akan dikembalikan —</option>' +
        peminjamanList.map(p => {
          const alat = alatList.find(a => a.id_alat === p.id_alat);
          const personil = personilList.find(x => x.id_personil === p.id_personil);
          const namaAlat = alat ? alat.nama_alat : p.id_alat;
          const namaPeminjam = personil ? personil.nama : p.id_personil;
          return `<option value="${esc(p.id_pinjam)}" data-alat="${esc(p.id_alat)}" data-personil="${esc(p.id_personil)}" data-waktu="${esc(p.waktu_pinjam)}" data-catatan="${esc(p.catatan_pinjam || '-')}">${esc(namaAlat)} — dipinjam oleh ${esc(namaPeminjam)}</option>`;
        }).join('');
        
      form.id_pinjam.addEventListener('change', function() {
        const opt = this.options[this.selectedIndex];
        if (!opt.value) {
          $('info-pinjam').classList.add('hidden');
          return;
        }
        const personil = personilList.find(p => p.id_personil === opt.dataset.personil);
        $('kembali-peminjam').textContent = personil ? personil.nama : opt.dataset.personil;
        $('kembali-waktu').textContent = opt.dataset.waktu || '-';
        $('kembali-catatan').textContent = opt.dataset.catatan || '-';
        $('info-pinjam').classList.remove('hidden');
      });
    }

    function teksNotifKembali(alat, personil, kondisi) {
      if (!alat || !personil) {
        console.error('teksNotifKembali: alat atau personil null', {alat, personil});
        return null;
      }
      const waktu = new Date().toLocaleString('id-ID', {day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
      const kondisiText = kondisi === 'baik' ? '✅ Baik' : (kondisi === 'rusak_ringan' ? '⚠️ Rusak Ringan' : '❌ Rusak Berat');
      return `📦 <b>Alat Dikembalikan</b>\n\n<b>Alat:</b> ${alat.nama_alat || '-'}\n<b>Kategori:</b> ${alat.kategori || '-'}\n<b>Dikembalikan oleh:</b> ${personil.nama || '-'}\n<b>Jabatan:</b> ${personil.jabatan || '-'}\n<b>Kondisi:</b> ${kondisiText}\n<b>Waktu:</b> ${waktu}`;
    }

    function bootstrapKembali() {
      const form = $('form-kembali');
      
      form.foto_kembali.addEventListener('change', () => {
        const f = form.foto_kembali.files[0];
        const img = $('preview-kembali');
        if (!f) { img.classList.add('hidden'); return; }
        img.src = URL.createObjectURL(f);
        img.classList.remove('hidden');
      });

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const idPinjam = fd.get('id_pinjam');
        const file = fd.get('foto_kembali');
        const kondisi = fd.get('kondisi_kembali');
        const catatan = fd.get('catatan_kembali');
        
        if (!idPinjam) { alert('Pilih alat yang akan dikembalikan.'); return; }
        if (!file || !file.size) { alert('Foto kondisi alat wajib diunggah.'); return; }

        const pinjaman = peminjamanList.find(p => p.id_pinjam === idPinjam);
        if (!pinjaman) { alert('Data peminjaman tidak ditemukan.'); return; }

        const btn = e.target.querySelector('[type=submit]');
        btn.disabled = true; btn.textContent = 'Mengunggah foto…';
        
        try {
          const fotoUrl = await unggahFotoPeminjaman(file, `kembali-${pinjaman.id_alat}`);
          btn.textContent = 'Menyimpan…';
          
          await kembalikanAlat({
            id_pinjam: idPinjam,
            id_alat: pinjaman.id_alat,
            foto_kembali_url: fotoUrl,
            kondisi_kembali: kondisi,
            catatan_kembali: catatan
          });
          
          await muat();
          await muatPeminjaman();

          const alat = alatList.find(a => a.id_alat === pinjaman.id_alat);
          const personil = personilList.find(p => p.id_personil === pinjaman.id_personil);
          toast(`${alat ? alat.nama_alat : 'Alat'} berhasil dikembalikan`);
          
          const notifText = teksNotifKembali(alat, personil, kondisi);
          if (notifText) await kirimNotif(notifText);

          e.target.reset();
          $('preview-kembali').classList.add('hidden');
          $('info-pinjam').classList.add('hidden');
          isiOpsiKembali();
        } catch (err) {
          alert('Gagal: ' + err.message);
        } finally {
          btn.disabled = false; btn.textContent = 'Kembalikan Alat';
        }
      });
    }

    // ---------- Mode Kelola Data ----------
    function renderKelola() {
      $('daftar-alat-kelola').innerHTML = alatList.length
        ? alatList.map((a) => `
          <div class="flex items-center justify-between text-xs py-1.5 gap-2">
            <div class="flex-1 min-w-0">
              <span class="truncate">${esc(a.nama_alat)} <span class="text-on-surface-variant">— ${esc(a.kategori)}</span></span>
              <span class="text-[10px] font-bold ${a.status === 'dipinjam' ? 'text-tertiary' : 'text-secondary'} shrink-0 ml-2">${a.status}</span>

            <div class="flex gap-1 shrink-0">
              <button onclick="editAlat('${esc(a.id_alat)}')" class="text-primary hover:bg-primary/10 rounded p-1" title="Edit">
                <span class="material-symbols-outlined text-sm">edit</span>
              </button>
              <button onclick="hapusAlat('${esc(a.id_alat)}')" class="text-error hover:bg-error/10 rounded p-1" title="Hapus" ${a.status === 'dipinjam' ? 'disabled' : ''}>
                <span class="material-symbols-outlined text-sm">delete</span>
              </button>
            </div>
          </div>`).join('')
        : '<p class="text-xs text-on-surface-variant">Belum ada alat.</p>';

      $('daftar-personil-kelola').innerHTML = personilList.length
        ? personilList.map((p) => `
          <div class="flex items-center justify-between text-xs py-1.5 gap-2">
            <div class="flex-1 min-w-0">
              <span>${esc(p.nama)}${p.jabatan ? ` <span class="text-on-surface-variant">— ${esc(p.jabatan)}</span>` : ''}</span>
            </div>
            <div class="flex gap-1 shrink-0">
              <button onclick="editPersonil('${esc(p.id_personil)}')" class="text-primary hover:bg-primary/10 rounded p-1" title="Edit">
                <span class="material-symbols-outlined text-sm">edit</span>
              </button>
              <button onclick="hapusPersonil('${esc(p.id_personil)}')" class="text-error hover:bg-error/10 rounded p-1" title="Hapus">
                <span class="material-symbols-outlined text-sm">delete</span>
              </button>
            </div>
          </div>`).join('')
        : '<p class="text-xs text-on-surface-variant">Belum ada personil.</p>';
    }

    function bootstrapKelola() {
      const formAlat = $('form-alat');
      formAlat.kategori.innerHTML = KATEGORI_ALAT.map((k) => `<option value="${esc(k)}">${esc(k)}</option>`).join('');
      formAlat.kondisi.innerHTML = KONDISI_ALAT.map((k) => `<option value="${k.key}">${esc(k.label)}</option>`).join('');

      formAlat.addEventListener('submit', async (e) => {
        e.preventDefault();
        const fd = Object.fromEntries(new FormData(e.target).entries());
        const btn = e.target.querySelector('[type=submit]');
        btn.disabled = true; btn.textContent = 'Menyimpan…';
        try {
          if (editingAlatId) {
            // Mode edit
            const updated = alatList.map(a => a.id_alat === editingAlatId
              ? { ...a, ...fd, updated_at: new Date().toISOString() }
              : a);
            await apiSave('alat_master', updated);
            toast('Alat diupdate');
            editingAlatId = null;
          } else {
            // Mode tambah baru
            await addAlat(fd);
            toast('Alat baru tersimpan');
          }
          
          e.target.reset();
          formAlat.kategori.innerHTML = KATEGORI_ALAT.map((k) => `<option value="${esc(k)}">${esc(k)}</option>`).join('');
          formAlat.kondisi.innerHTML = KONDISI_ALAT.map((k) => `<option value="${k.key}">${esc(k.label)}</option>`).join('');
          await muat();
          
          // Reset button
          btn.textContent = 'Simpan alat';
          btn.classList.remove('bg-tertiary');
          btn.classList.add('bg-primary');
          $('btn-batal-alat').classList.add('hidden');
        } catch (err) { alert('Gagal: ' + err.message); }
        finally { btn.disabled = false; btn.textContent = editingAlatId ? 'Update alat' : 'Simpan alat'; }
      });

      $('form-personil').addEventListener('submit', async (e) => {
        e.preventDefault();
        const fd = Object.fromEntries(new FormData(e.target).entries());
        const btn = e.target.querySelector('[type=submit]');
        btn.disabled = true; btn.textContent = 'Menyimpan…';
        try {
          if (editingPersonilId) {
            // Mode edit
            const updated = personilList.map(p => p.id_personil === editingPersonilId
              ? { ...p, ...fd, updated_at: new Date().toISOString() }
              : p);
            await apiSave('personil_master', updated);
            toast('Personil diupdate');
            editingPersonilId = null;
          } else {
            // Mode tambah baru
            await addPersonil(fd);
            toast('Personil baru tersimpan');
          }
          
          e.target.reset();
          await muat();
          
          // Reset button
          btn.textContent = 'Simpan personil';
          btn.classList.remove('bg-tertiary');
          btn.classList.add('bg-primary');
          $('btn-batal-personil').classList.add('hidden');
        } catch (err) { alert('Gagal: ' + err.message); }
        finally { btn.disabled = false; btn.textContent = editingPersonilId ? 'Update personil' : 'Simpan personil'; }
      });
    }

    // ---------- Edit & Hapus Alat ----------
    let editingAlatId = null;

    function editAlat(idAlat) {
      const alat = alatList.find(a => a.id_alat === idAlat);
      if (!alat) return;
      
      editingAlatId = idAlat;
      const form = $('form-alat');
      form.nama_alat.value = alat.nama_alat;
      form.kategori.value = alat.kategori;
      form.kondisi.value = alat.kondisi;
      form.catatan.value = alat.catatan || '';
      
      const btn = form.querySelector('[type=submit]');
      btn.textContent = 'Update alat';
      btn.classList.remove('bg-primary');
      btn.classList.add('bg-tertiary');
      
      $('btn-batal-alat').classList.remove('hidden');
      
      // Scroll to form
      form.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function batalEditAlat() {
      editingAlatId = null;
      const form = $('form-alat');
      form.reset();
      form.kategori.innerHTML = KATEGORI_ALAT.map((k) => `<option value="${esc(k)}">${esc(k)}</option>`).join('');
      form.kondisi.innerHTML = KONDISI_ALAT.map((k) => `<option value="${k.key}">${esc(k.label)}</option>`).join('');
      
      const btn = form.querySelector('[type=submit]');
      btn.textContent = 'Simpan alat';
      btn.classList.remove('bg-tertiary');
      btn.classList.add('bg-primary');
      
      $('btn-batal-alat').classList.add('hidden');
    }

    async function hapusAlat(idAlat) {
      const alat = alatList.find(a => a.id_alat === idAlat);
      if (!alat) return;
      
      if (alat.status === 'dipinjam') {
        alert('Tidak bisa hapus alat yang sedang dipinjam.');
        return;
      }
      
      if (!confirm(`Hapus alat "${alat.nama_alat}"?`)) return;
      
      try {
        const updated = alatList.filter(a => a.id_alat !== idAlat);
        await apiSave('alat_master', updated);
        await muat();
        toast('Alat dihapus');
      } catch (err) {
        alert('Gagal hapus: ' + err.message);
      }
    }

    // ---------- Edit & Hapus Personil ----------
    let editingPersonilId = null;

    function editPersonil(idPersonil) {
      const personil = personilList.find(p => p.id_personil === idPersonil);
      if (!personil) return;
      
      editingPersonilId = idPersonil;
      const form = $('form-personil');
      form.nama.value = personil.nama;
      form.jabatan.value = personil.jabatan || '';
      
      const btn = form.querySelector('[type=submit]');
      btn.textContent = 'Update personil';
      btn.classList.remove('bg-primary');
      btn.classList.add('bg-tertiary');
      
      $('btn-batal-personil').classList.remove('hidden');
      
      // Scroll to form
      form.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function batalEditPersonil() {
      editingPersonilId = null;
      const form = $('form-personil');
      form.reset();
      
      const btn = form.querySelector('[type=submit]');
      btn.textContent = 'Simpan personil';
      btn.classList.remove('bg-tertiary');
      btn.classList.add('bg-primary');
      
      $('btn-batal-personil').classList.add('hidden');
    }

    async function hapusPersonil(idPersonil) {
      const personil = personilList.find(p => p.id_personil === idPersonil);
      if (!personil) return;
      
      // Cek apakah personil sedang meminjam
      const sedangPinjam = peminjamanList.some(pm => pm.id_personil === idPersonil && pm.status === 'dipinjam');
      if (sedangPinjam) {
        alert(`Tidak bisa hapus "${personil.nama}" karena sedang meminjam alat.`);
        return;
      }
      
      if (!confirm(`Hapus personil "${personil.nama}"?`)) return;
      
      try {
        const updated = personilList.filter(p => p.id_personil !== idPersonil);
        await apiSave('personil_master', updated);
        await muat();
        toast('Personil dihapus');
      } catch (err) {
        alert('Gagal hapus: ' + err.message);
      }
    }

    // ---------- Init ----------
    async function muat() {
      try {
        [alatList, personilList, peminjamanList] = await Promise.all([loadAlat(), loadPersonil(), loadPeminjaman()]);
        alatRangkuman = rangkumAlat(alatList, peminjamanList, personilList);
        hideError();
      } catch (err) {
        alatList = []; personilList = []; peminjamanList = []; alatRangkuman = [];
        showError(err.message);
      }
      const s = ringkasPeminjaman(alatRangkuman);
      $('m-total').textContent = formatNumber(s.total);
      $('m-tersedia').textContent = formatNumber(s.tersedia);
      $('m-dipinjam').textContent = formatNumber(s.dipinjam);
      $('m-perbaikan').textContent = formatNumber(s.perluPerbaikan);
      renderGrid();
      if (mode === 'kelola') renderKelola();
      if (mode === 'pinjam') isiOpsiPinjam();
    }

    async function bootstrap() {
      const c = $('page-content');
      c.innerHTML = '';
      c.appendChild($('pj-template').content.cloneNode(true));

      setTab('monitor');
      $('tab-monitor').addEventListener('click', () => setTab('monitor'));
      $('tab-pinjam').addEventListener('click', () => setTab('pinjam'));
      $('tab-kembali').addEventListener('click', () => setTab('kembali'));
      $('tab-kelola').addEventListener('click', () => setTab('kelola'));
      $('cari').addEventListener('input', renderGrid);
      $('filter-status').addEventListener('change', renderGrid);
      document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

      bootstrapPinjam();
      bootstrapKembali();
